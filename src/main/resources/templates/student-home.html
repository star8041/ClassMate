<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홈 - ClassMate</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #4A7CF7; --blue-dark: #3563D6; --blue-light: #EEF4FF;
    --bg: #F4F7FE; --text: #1F2937; --muted: #9AA3B2; --border: #E8ECF4;
  }
  body { font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  a { text-decoration: none; color: inherit; }

  /* ── 전체 레이아웃 ── */
  .s-wrap { display: flex; min-height: 100vh; }
  .main   { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; height: 100vh; }

  /* ── 사이드바 ── */
  .s-side { width: 220px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--border); padding: 20px 14px; display: flex; flex-direction: column; }
  .s-logo { display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 800; color: var(--blue); padding: 4px 8px 22px; }
  .s-nav  { display: flex; flex-direction: column; gap: 3px; }
  .s-nav a { display: flex; align-items: center; gap: 11px; padding: 12px 13px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #6B7280; }
  .s-nav a:hover { background: #F4F7FB; }
  .s-nav a.on { background: var(--blue-light); color: var(--blue); }

  /* ── 상단 헤더 ── */
  .topbar { height: 62px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 24px; flex-shrink: 0; }
  .student-name-badge { font-size: 15px; font-weight: 700; color: var(--text); }
  .student-name-badge span { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: 3px; }
  .logout-btn { display: flex; align-items: center; gap: 6px; color: #6B7280; font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: none; font-family: inherit; }
  .logout-btn:hover { color: #EF4444; }

  /* ── 본문 영역 ── */
  .dashboard-body { flex: 1; display: flex; flex-direction: column; padding: 20px 24px; min-height: 0; overflow: hidden; }

  .dashboard-grid { display: flex; gap: 16px; flex: 1; min-height: 0; }

  /* ── 채팅 패널 ── */
  .chat-panel { flex: 7; display: flex; flex-direction: column; min-height: 0; background: #fff; border-radius: 18px; border: 1px solid var(--border); overflow: hidden; }

  .chat-panel-header { padding: 14px 18px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: #fff; }
  .chat-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .chat-title-wrap { display: flex; align-items: center; gap: 10px; }
  .chat-icon { width: 34px; height: 34px; background: linear-gradient(135deg, var(--blue), #7FA8FB); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .chat-title { font-size: 14px; font-weight: 700; color: var(--text); }
  .chat-subtitle { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .btn-new-chat { display: flex; align-items: center; gap: 5px; padding: 7px 13px; background: var(--blue); color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-new-chat:hover { background: var(--blue-dark); }

  /* 과목 선택 */
  .subject-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
  .subjects { display: flex; flex-wrap: wrap; gap: 7px; }
  .subject { display: flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 20px; border: 1.5px solid var(--border); background: #fff; font-size: 13px; font-weight: 600; color: #4B5563; cursor: pointer; transition: all 0.15s; user-select: none; }
  .subject:hover { border-color: #C9D6F5; background: #F5F8FF; }
  .subject.active { background: #FFF0F5; border-color: #FFB3CB; color: #E84B7C; }

  /* 메시지 영역 */
  .messages-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; background: #F9FAFB; min-height: 0; }
  .messages-area::-webkit-scrollbar { width: 4px; }
  .messages-area::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 4px; }

  .welcome-msg { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center; padding: 30px; }
  .welcome-mascot { font-size: 56px; margin-bottom: 12px; }
  .welcome-msg h4 { font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
  .welcome-msg p  { font-size: 13px; color: var(--muted); line-height: 1.7; }

  .message-row { display: flex; gap: 8px; max-width: 84%; }
  .message-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .message-row.ai   { align-self: flex-start; }

  .msg-avatar { width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .msg-avatar.ai   { background: linear-gradient(135deg, var(--blue), #7FA8FB); }
  .msg-avatar.user { background: #E8ECF4; }

  .msg-bubble { padding: 11px 15px; border-radius: 14px; font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .msg-bubble.ai   { background: #fff; border: 1px solid var(--border); color: var(--text); border-top-left-radius: 3px; }
  .msg-bubble.user { background: var(--blue); color: #fff; border-top-right-radius: 3px; }
  .msg-bubble.thinking { color: var(--muted); font-style: italic; }

  /* 입력 영역 */
  .chat-input-area { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; background: #fff; }
  .chat-input-wrap { flex: 1; }
  .chat-input-wrap textarea { width: 100%; min-height: 44px; max-height: 130px; padding: 11px 14px; border: 1.5px solid #D1D5DB; border-radius: 12px; font-size: 14px; color: var(--text); resize: none; outline: none; font-family: inherit; line-height: 1.5; transition: border-color 0.2s; box-sizing: border-box; }
  .chat-input-wrap textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(74,124,247,.10); }
  .chat-input-wrap textarea::placeholder { color: var(--muted); }

  .btn-send { width: 44px; height: 44px; border-radius: 12px; background: var(--blue); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .btn-send:hover    { background: var(--blue-dark); }
  .btn-send:disabled { background: #93C5FD; cursor: not-allowed; }

  /* ── 세션 목록 패널 ── */
  .sessions-panel { flex: 3; display: flex; flex-direction: column; min-height: 0; background: #fff; border-radius: 18px; border: 1px solid var(--border); overflow: hidden; }

  .sessions-header { padding: 14px 16px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .sessions-header h3 { font-size: 13.5px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
  .sessions-search { position: relative; }
  .sessions-search input { width: 100%; padding: 7px 11px 7px 30px; border: 1px solid var(--border); border-radius: 10px; font-size: 12.5px; outline: none; box-sizing: border-box; color: var(--text); font-family: inherit; }
  .sessions-search input:focus { border-color: var(--blue); }
  .s-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); }

  .sessions-list { flex: 1; overflow-y: auto; min-height: 0; }
  .sessions-list::-webkit-scrollbar { width: 4px; }
  .sessions-list::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 4px; }

  .session-item { padding: 12px 16px; border-bottom: 1px solid #F3F4F6; cursor: pointer; transition: background 0.15s; }
  .session-item:hover { background: #F9FAFB; }
  .session-item.active { background: var(--blue-light); border-left: 3px solid var(--blue); }
  .session-item-title { font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item-date  { font-size: 11px; color: var(--muted); }

  .session-action-btn { display: none; background: none; border: none; cursor: pointer; padding: 3px; color: var(--muted); border-radius: 5px; flex-shrink: 0; }
  .session-action-btn:hover { color: var(--blue); background: #EEF4FF; }
  .session-delete-btn:hover { color: #EF4444 !important; background: #FEF2F2 !important; }
  .session-item:hover .session-action-btn { display: flex; align-items: center; justify-content: center; }

  .sessions-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; color: var(--muted); font-size: 13px; text-align: center; gap: 10px; }
</style>
</head>
<body>
<div class="s-wrap">

  <!-- 사이드바 -->
  <div th:replace="~{fragments/student-sidebar :: studentSidebar('home')}"></div>

  <!-- 본문 -->
  <div class="main">

    <!-- 헤더 -->
    <div class="topbar">
      <span class="student-name-badge" id="studentNameBadge">학생<span>학생</span></span>
      <button class="logout-btn" onclick="doLogout()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        로그아웃
      </button>
    </div>

    <!-- 대시보드 -->
    <div class="dashboard-body">
      <div class="dashboard-grid">

        <!-- 채팅 패널 -->
        <div class="chat-panel">
          <div class="chat-panel-header">
            <div class="chat-header-top">
              <div class="chat-title-wrap">
                <div class="chat-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </div>
                <div>
                  <div class="chat-title">ClassMate AI</div>
                  <div class="chat-subtitle" id="sessionSubtitle">새 대화를 시작해 보세요 😊</div>
                </div>
              </div>
              <button class="btn-new-chat" onclick="newChat()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                새 대화
              </button>
            </div>

            <!-- 과목 선택 -->
            <div class="subject-label">과목 선택 <span style="font-weight:400">(선택 안 해도 돼요!)</span></div>
            <div class="subjects">
              <div class="subject" onclick="toggleSubject(this)" data-subject="국어">📕 국어</div>
              <div class="subject" onclick="toggleSubject(this)" data-subject="수학">🧮 수학</div>
              <div class="subject" onclick="toggleSubject(this)" data-subject="과학">🧪 과학</div>
              <div class="subject" onclick="toggleSubject(this)" data-subject="사회">🌍 사회</div>
              <div class="subject" onclick="toggleSubject(this)" data-subject="영어">🔤 영어</div>
            </div>
          </div>

          <div class="messages-area" id="messagesArea">
            <div class="welcome-msg" id="welcomeMsg">
              <div class="welcome-mascot">🤖</div>
              <h4 id="welcomeTitle">안녕! 나는 ClassMate AI야!</h4>
              <p>궁금한 것을 뭐든지 물어봐! 😊<br>과목을 선택하면 더 잘 도와줄 수 있어.</p>
            </div>
          </div>

          <div class="chat-input-area">
            <div class="chat-input-wrap">
              <textarea id="chatInput"
                        placeholder="궁금한 것을 자유롭게 물어봐!"
                        rows="1"
                        onkeydown="handleKey(event)"
                        oninput="autoResize(this)"></textarea>
            </div>
            <button class="btn-send" id="sendBtn" onclick="sendMessage()" title="전송">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>

        <!-- 세션 목록 패널 -->
        <div class="sessions-panel">
          <div class="sessions-header">
            <h3>💬 대화 목록</h3>
            <div class="sessions-search">
              <svg class="s-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="sessionSearch" placeholder="대화 검색..." oninput="filterSessions(this.value)">
            </div>
          </div>
          <div class="sessions-list" id="sessionsList">
            <div class="sessions-empty">
              <span style="font-size:36px">💬</span>
              아직 대화가 없어요!<br>새 대화를 시작해 보세요.
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  const token = localStorage.getItem('accessToken');

  (function checkAuth() {
    if (!token) {
      alert('로그인이 필요합니다.');
      location.href = '/login';
      return;
    }
    try {
      const b64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      const payload = JSON.parse(decodeURIComponent(atob(b64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
      if (payload.role !== 'STUDENT' && payload.role !== 'ADMIN') {
        alert('학생 계정으로 로그인해주세요.');
        location.href = '/login';
      }
    } catch {
      alert('로그인 정보가 올바르지 않습니다. 다시 로그인해주세요.');
      location.href = '/login';
    }
  })();

  let currentSessionId = null;
  let allSessions = [];
  let isStreaming = false;
  let selectedSubject = null;
  let studentName = '학생';

  function jwtPayload(jwt) {
    try {
      const b64 = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(decodeURIComponent(atob(b64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
    } catch { return null; }
  }

  function authHeaders() {
    return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
  }

  document.addEventListener('DOMContentLoaded', async () => {
    const p = jwtPayload(token);
    if (p) {
      studentName = p.name || '학생';
      document.getElementById('studentNameBadge').innerHTML = studentName + '<span> 학생</span>';
      document.getElementById('welcomeTitle').textContent = '안녕, ' + studentName + '! 나는 ClassMate AI야!';
    }
    await loadSessions();
  });

  function doLogout() {
    ['accessToken', 'tokenType', 'loginRole'].forEach(k => localStorage.removeItem(k));
    location.href = '/login';
  }

  /* ── 과목 토글 ── */
  function toggleSubject(el) {
    const isActive = el.classList.contains('active');
    document.querySelectorAll('.subject').forEach(s => s.classList.remove('active'));
    if (!isActive) {
      el.classList.add('active');
      selectedSubject = el.dataset.subject;
    } else {
      selectedSubject = null;
    }
  }

  /* ── 세션 목록 ── */
  async function loadSessions() {
    try {
      const res = await fetch('/api/v1/student-chat/sessions', { headers: authHeaders() });
      if (!res.ok) return;
      const data = await res.json();
      allSessions = (data.data || []).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      renderSessions(allSessions);
      if (allSessions.length > 0) selectSession(allSessions[0]);
    } catch (e) { console.error('세션 로드 실패:', e); }
  }

  function renderSessions(list) {
    const el = document.getElementById('sessionsList');
    if (list.length === 0) {
      el.innerHTML = `<div class="sessions-empty"><span style="font-size:36px">💬</span>아직 대화가 없어요!<br>새 대화를 시작해 보세요.</div>`;
      return;
    }
    el.innerHTML = list.map(s => `
      <div class="session-item${s.chatSessionId === currentSessionId ? ' active' : ''}"
           onclick="selectSession(${JSON.stringify(s).replace(/"/g,'&quot;')})">
        <div style="display:flex;align-items:center;gap:4px;">
          <div class="session-item-title" id="title-${s.chatSessionId}">${esc(s.title || '새 대화')}</div>
          <button class="session-action-btn" title="제목 수정" onclick="event.stopPropagation();startEditTitle(${s.chatSessionId})">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
          <button class="session-action-btn session-delete-btn" title="삭제" onclick="event.stopPropagation();deleteSession(${s.chatSessionId})">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
              <path d="M10 11v6"/><path d="M14 11v6"/>
            </svg>
          </button>
        </div>
        <div class="session-item-date">${fmtDate(s.createdAt)}</div>
      </div>`).join('');
  }

  function filterSessions(q) {
    const kw = q.trim().toLowerCase();
    renderSessions(kw ? allSessions.filter(s => (s.title || '').toLowerCase().includes(kw)) : allSessions);
  }

  /* ── 세션 선택 ── */
  async function selectSession(session) {
    if (typeof session === 'string') session = JSON.parse(session);
    currentSessionId = session.chatSessionId;
    document.getElementById('sessionSubtitle').textContent = session.title || '새 대화';
    renderSessions(allSessions);

    const area = document.getElementById('messagesArea');
    area.innerHTML = '<div style="padding:20px;color:#9CA3AF;font-size:13px;text-align:center;">불러오는 중... 🔄</div>';

    try {
      const res = await fetch(`/api/v1/student-chat/sessions/${session.chatSessionId}/messages`, { headers: authHeaders() });
      if (!res.ok) throw new Error();
      const result = await res.json();
      const messages = result.data || [];

      area.innerHTML = '';
      if (messages.length === 0) {
        area.innerHTML = `<div class="welcome-msg" id="welcomeMsg">
          <div class="welcome-mascot">🤖</div>
          <h4>${esc(session.title || '새 대화')}</h4>
          <p>이 대화를 이어서 해봐! 😊</p>
        </div>`;
      } else {
        messages.forEach(m => appendMsg(area, m.role === 'STUDENT' ? 'user' : 'ai', m.messageText));
        area.scrollTop = area.scrollHeight;
      }
    } catch {
      area.innerHTML = '<div style="padding:20px;color:#EF4444;font-size:13px;text-align:center;">메시지를 불러올 수 없어요 😢</div>';
    }
  }

  /* ── 새 대화 ── */
  async function newChat() {
    if (isStreaming) return;
    try {
      const title = new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' }) + ' 대화';
      const res = await fetch('/api/v1/student-chat/sessions', {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ materialId: null, title })
      });
      if (!res.ok) { alert('새 대화를 시작할 수 없어요.'); return; }
      const session = (await res.json()).data;
      allSessions.unshift(session);
      renderSessions(allSessions);
      selectSession(session);
    } catch { alert('오류가 발생했어요. 다시 시도해 봐!'); }
  }

  /* ── 제목 수정 ── */
  function startEditTitle(sessionId) {
    const el = document.getElementById('title-' + sessionId);
    if (!el) return;
    const current = el.textContent;
    el.innerHTML = `<input id="title-input-${sessionId}"
      value="${esc(current)}"
      style="width:100%;font-size:12.5px;border:1px solid var(--blue);border-radius:5px;padding:2px 6px;outline:none;font-family:inherit;"
      onclick="event.stopPropagation()"
      onkeydown="handleTitleKey(event,${sessionId})"
      onblur="saveTitleEdit(${sessionId})">`;
    const input = document.getElementById('title-input-' + sessionId);
    input?.focus(); input?.select();
  }

  function handleTitleKey(e, sessionId) {
    if (e.key === 'Enter')  { e.preventDefault(); saveTitleEdit(sessionId); }
    if (e.key === 'Escape') { renderSessions(allSessions); }
  }

  async function saveTitleEdit(sessionId) {
    const input = document.getElementById('title-input-' + sessionId);
    if (!input) return;
    const newTitle = input.value.trim();
    if (!newTitle) { renderSessions(allSessions); return; }
    try {
      const res = await fetch(`/api/v1/student-chat/sessions/${sessionId}`, {
        method: 'PATCH', headers: authHeaders(),
        body: JSON.stringify({ title: newTitle })
      });
      if (res.ok) {
        const s = allSessions.find(s => s.chatSessionId === sessionId);
        if (s) s.title = newTitle;
        if (currentSessionId === sessionId)
          document.getElementById('sessionSubtitle').textContent = newTitle;
      }
    } catch {}
    renderSessions(allSessions);
  }

  /* ── 세션 삭제 ── */
  async function deleteSession(sessionId) {
    if (!confirm('이 대화를 삭제할까요?')) return;
    try {
      const res = await fetch(`/api/v1/student-chat/sessions/${sessionId}`, {
        method: 'DELETE', headers: authHeaders()
      });
      if (res.ok) {
        allSessions = allSessions.filter(s => s.chatSessionId !== sessionId);
        if (currentSessionId === sessionId) {
          currentSessionId = null;
          document.getElementById('messagesArea').innerHTML = `<div class="welcome-msg" id="welcomeMsg">
            <div class="welcome-mascot">🤖</div>
            <h4>안녕, ${esc(studentName)}! 나는 ClassMate AI야!</h4>
            <p>궁금한 것을 뭐든지 물어봐! 😊</p>
          </div>`;
          document.getElementById('sessionSubtitle').textContent = '새 대화를 시작해 보세요 😊';
        }
        renderSessions(allSessions);
      }
    } catch {}
  }

  /* ── 메시지 전송 ── */
  async function ensureSession() {
    if (currentSessionId) return true;
    try {
      const title = new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' }) + ' 대화';
      const res = await fetch('/api/v1/student-chat/sessions', {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ materialId: null, title })
      });
      if (!res.ok) return false;
      const session = (await res.json()).data;
      currentSessionId = session.chatSessionId;
      allSessions.unshift(session);
      renderSessions(allSessions);
      document.getElementById('sessionSubtitle').textContent = session.title;
      return true;
    } catch { return false; }
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 130) + 'px';
  }

  async function sendMessage() {
    if (isStreaming) return;
    const ta = document.getElementById('chatInput');
    let text = ta.value.trim();
    if (!text) return;

    // 과목 선택 시 프롬프트에 포함
    if (selectedSubject) text = '[과목: ' + selectedSubject + '] ' + text;

    if (!await ensureSession()) { alert('대화를 시작할 수 없어요.'); return; }

    ta.value = ''; ta.style.height = 'auto';
    document.getElementById('welcomeMsg')?.remove();

    const area    = document.getElementById('messagesArea');
    appendMsg(area, 'user', text);
    const aiRow   = appendMsg(area, 'ai', '답변을 만드는 중이에요... 🤔', true);
    const aiBubble = aiRow.querySelector('.msg-bubble');

    isStreaming = true;
    document.getElementById('sendBtn').disabled = true;

    try {
      const res = await fetch(`/api/v1/student-chat/sessions/${currentSessionId}/messages`, {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ messageText: text })
      });
      if (!res.ok) {
        aiBubble.textContent = '앗, 답변을 받지 못했어요. 다시 시도해 봐! 😢';
        aiBubble.classList.remove('thinking');
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      aiBubble.classList.remove('thinking');
      aiBubble.textContent = '';

      let fullText = '', buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const chunk = line.slice(5);
          if (!chunk || chunk.trim() === '[DONE]') continue;
          fullText += chunk;
          aiBubble.textContent = fullText;
          area.scrollTop = area.scrollHeight;
        }
      }
      if (buf.startsWith('data:')) {
        const chunk = buf.slice(5);
        if (chunk && chunk.trim() !== '[DONE]') { fullText += chunk; aiBubble.textContent = fullText; }
      }
      if (!fullText) aiBubble.textContent = '응답을 받지 못했어요.';

    } catch {
      aiBubble.textContent = '네트워크 오류가 발생했어요. 다시 시도해 봐!';
      aiBubble.classList.remove('thinking');
    } finally {
      isStreaming = false;
      document.getElementById('sendBtn').disabled = false;
      area.scrollTop = area.scrollHeight;
    }
  }

  function appendMsg(area, role, text, thinking = false) {
    const avatar = role === 'user' ? (studentName.charAt(0) || '나') : '🤖';
    const row = document.createElement('div');
    row.className = 'message-row ' + role;
    row.innerHTML = `<div class="msg-avatar ${role}">${avatar}</div><div class="msg-bubble ${role}${thinking ? ' thinking' : ''}">${esc(text)}</div>`;
    area.appendChild(row);
    area.scrollTop = area.scrollHeight;
    return row;
  }

  function esc(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function fmtDate(str) {
    if (!str) return '';
    try { return new Date(str).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' }); }
    catch { return str; }
  }
</script>
