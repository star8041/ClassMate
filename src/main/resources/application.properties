spring.application.name=classmate

spring.messages.basename=i18n/message

# ===== RDB (PostgreSQL, Primary) =====

spring.datasource.url=jdbc:postgresql://localhost:5432/classmate
spring.datasource.username=classmate
spring.datasource.password=classmate1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== Vector DB (pgvector, 별도 인스턴스) =====
app.vector.datasource.url=jdbc:postgresql://localhost:5433/classmate_vector
app.vector.datasource.username=classmate
app.vector.datasource.password=classmate1234
app.vector.datasource.driver-class-name=org.postgresql.Driver


# 기본 pgvector 자동설정(Primary RDB 사용)은 비활성화 — VectorStoreConfig 가 벡터DB 전용 빈을 직접 정의
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

# ===== 파일 업로드 제한 =====

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===== 강의자료(PDF) 저장 경로 =====

app.material.upload-dir=uploads/materials

# ===== JWT =====

# TODO: 운영 시 환경변수/시크릿으로 분리할 것

app.jwt.secret=${APP_JWT_SECRET:classmate-dev-secret-key-please-change-in-production-0123456789}
app.jwt.expiration-ms=86400000

# ===== 기존 JWT 설정 호환용 =====

jwt.secret=${JWT_SECRET:classmate-dev-secret-key-please-change-in-production-0123456789}
jwt.expiration-ms=86400000

# ===== 초대코드 설정 =====

app.invite-code.ttl-minutes=10

# ===== 에러 응답 설정 =====

spring.web.error.include-stacktrace=never
spring.web.error.include-message=always

# ===== Spring AI (OpenAI) =====

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.embedding.options.model=text-embedding-3-small

# ===== Vector DB (pgvector) =====

spring.ai.vectorstore.pgvector.url=jdbc:postgresql://localhost:5433/classmate_vector
spring.ai.vectorstore.pgvector.username=classmate
spring.ai.vectorstore.pgvector.password=classmate1234
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.initialize-schema=false
