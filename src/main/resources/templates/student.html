<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생 관리 - 미리보기</title>
<link rel="stylesheet" th:href="@{/css/layout.css}">
<link rel="stylesheet" th:href="@{/css/sidebar.css}">
<link rel="stylesheet" th:href="@{/css/fonts.css}">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; background: #f4f5f7; color: #1a1a1a; font-size: 14px; }

  /* ── 페이지 레이아웃 ── */
  .page-body { padding: 32px 36px; }
  .page-title { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; }
  .page-subtitle { font-size: 13px; color: #999; margin-bottom: 20px; }

  /* ── 메인 2컬럼 ── */
  .main-grid { display: grid; grid-template-columns: 220px 1fr; gap: 16px; align-items: start; }

  /* ── 카드 공통 ── */
  .card { background: #fff; border-radius: 12px; border: 0.5px solid #e0e0e0; }

  /* ══════════════════════════════
     학생 목록 사이드패널
  ══════════════════════════════ */
  .student-list-panel { padding: 16px; }
  #studentList { max-height: 480px; overflow-y: auto; }
  .panel-title { font-size: 13px; font-weight: 600; color: #444; margin-bottom: 10px; }

  .search-wrap { position: relative; margin-bottom: 10px; }
  .search-wrap input {
    width: 100%; height: 34px; border: 1px solid #ddd; border-radius: 8px;
    padding: 0 32px 0 10px; font-size: 13px; color: #1a1a1a; outline: none;
  }
  .search-wrap input:focus { border-color: #4f80f7; }
  .search-wrap svg { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: #aaa; pointer-events: none; }

  .student-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: background 0.15s;
  }
  .student-item:hover { background: #f5f5f5; }
  .student-item.active { background: #eef2ff; }
  .student-avatar {
    width: 34px; height: 34px; border-radius: 50%; background: #e0e0e0;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .student-avatar svg { color: #bbb; }
  .student-name { font-size: 13px; font-weight: 600; color: #1a1a1a; }
  .student-meta { font-size: 11px; color: #aaa; }

  .student-list-empty {
    padding: 24px 8px;
    font-size: 13px;
    color: #aaa;
    text-align: center;
    line-height: 1.5;
  }

  /* ══════════════════════════════
     우측 상세 패널
  ══════════════════════════════ */
  .detail-panel { padding: 20px 24px; }

  .student-header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .student-header-avatar {
    width: 50px; height: 50px; border-radius: 50%; background: #e8e8e8;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .student-header-name { font-size: 18px; font-weight: 700; color: #1a1a1a; margin-bottom: 2px; }
  .student-header-meta { font-size: 12px; color: #aaa; }
  .header-actions { margin-left: auto; display: flex; gap: 8px; }

  .btn-preview {
    background: #fff; border: 1px solid #4f80f7; color: #4f80f7; border-radius: 8px;
    padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer;
    display: flex; align-items: center; gap: 5px;
  }
  .btn-preview:hover { background: #f0f4ff; }

  .btn-download {
    background: #4f80f7; border: none; color: #fff; border-radius: 8px;
    padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer;
    display: flex; align-items: center; gap: 5px;
  }
  .btn-download:hover { background: #3a6ae0; }

  .tabs { display: flex; gap: 0; border-bottom: 1.5px solid #e8e8e8; margin-bottom: 18px; }
  .tab-btn {
    padding: 8px 16px; font-size: 13px; font-weight: 500; color: #aaa; background: none;
    border: none; border-bottom: 2px solid transparent; margin-bottom: -1.5px; cursor: pointer;
  }
  .tab-btn.active { color: #4f80f7; border-bottom-color: #4f80f7; }

  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .section-title { font-size: 14px; font-weight: 600; color: #1a1a1a; }

  .btn-refresh {
    background: #fff; border: 1px solid #ddd; border-radius: 8px;
    padding: 6px 14px; font-size: 12px; color: #333; cursor: pointer;
  }
  .btn-refresh:hover { background: #f5f5f5; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 12px; color: #aaa; font-weight: 500;
    padding: 8px 6px; border-bottom: 0.5px solid #e8e8e8;
  }
  tbody td {
    padding: 10px 6px; font-size: 13px; color: #333;
    border-bottom: 0.5px solid #f2f2f2; vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }

  .score-wrap { display: flex; align-items: center; gap: 2px; }
  .score-val { font-size: 14px; font-weight: 600; color: #1a1a1a; }
  .score-unit { font-size: 12px; color: #aaa; }

  .comment-box {
    width: 100%;
    min-height: 30px;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
    color: #999;
    background: #fafafa;
    display: flex;
    align-items: center;
  }

  .summary-section {
    margin-top: 20px;
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 16px;
    align-items: start;
  }
  .summary-title { font-size: 13px; font-weight: 600; color: #444; margin-bottom: 10px; }

  .stat-cards { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; }
  .stat-card { background: #f8f9fc; border-radius: 10px; padding: 12px 14px; text-align: center; }
  .stat-card-label { font-size: 11px; color: #aaa; margin-bottom: 6px; }
  .stat-card-val { font-size: 20px; font-weight: 700; color: #1a1a1a; }
  .stat-card-unit { font-size: 12px; color: #888; }

  .chart-wrap { background: #f8f9fc; border-radius: 10px; padding: 14px; }
  .chart-title { font-size: 12px; color: #aaa; margin-bottom: 10px; }
  .chart-inner { display: flex; align-items: center; gap: 14px; }
  .donut-svg { flex-shrink: 0; }
  .legend { display: flex; flex-direction: column; gap: 4px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #555; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>

<body>
<div class="layout-wrapper">

  <div th:replace="~{fragments/sidebar :: sidebar('student')}"></div>

  <div class="layout-main">
    <div th:replace="~{fragments/header :: header(${userName}, ${profileImgUrl})}"></div>

    <main class="page-body">
      <h1 class="page-title">학생 관리</h1>
      <p class="page-subtitle">학생별 퀴즈 응시 결과를 확인하고, 성취도 리포트를 관리하세요.</p>

      <div class="main-grid">

        <div class="card student-list-panel">
          <div class="panel-title">학생 목록</div>

          <div class="search-wrap">
            <input id="studentSearchInput" type="text" placeholder="이름 검색">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </div>

          <div id="studentList">
            <div class="student-list-empty">학생 목록을 불러오는 중입니다.</div>
          </div>
        </div>

        <div class="card detail-panel">

          <div class="student-header">
            <div class="student-header-avatar">
              <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"
                   viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.6">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>

            <div>
              <div id="selectedStudentName" class="student-header-name">학생을 선택해주세요</div>
              <div id="selectedStudentMeta" class="student-header-meta">-</div>
            </div>

            <div class="header-actions">
              <button class="btn-preview" type="button" onclick="goReportPage()">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                리포트 미리보기
              </button>

              <button class="btn-download" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                리포트 다운로드
              </button>
            </div>
          </div>

          <div class="tabs">
            <button class="tab-btn active" type="button">퀴즈 결과</button>
            <button class="tab-btn" type="button" onclick="goReportPage()">성취도 리포트</button>
          </div>

          <div class="section-header">
            <div class="section-title">퀴즈 결과 관리</div>
            <button id="refreshStudentBtn" class="btn-refresh" type="button">새로고침</button>
          </div>

          <table>
            <thead>
              <tr>
                <th style="width:220px">퀴즈명</th>
                <th style="width:110px">응시일</th>
                <th style="width:90px">점수</th>
                <th>코멘트</th>
              </tr>
            </thead>

            <tbody id="quizResultBody">
              <tr>
                <td colspan="4" style="text-align:center; color:#aaa; padding:30px;">
                  왼쪽에서 학생을 선택해주세요.
                </td>
              </tr>
            </tbody>
          </table>

          <div class="summary-section">
            <div>
              <div class="summary-title">퀴즈 결과 요약</div>

              <div class="stat-cards">
                <div class="stat-card">
                  <div class="stat-card-label">응시 퀴즈</div>
                  <div>
                    <span id="submittedQuizCount" class="stat-card-val">0</span>
                    <span class="stat-card-unit">개</span>
                  </div>
                </div>

                <div class="stat-card">
                  <div class="stat-card-label">평균 점수</div>
                  <div>
                    <span id="averageScore" class="stat-card-val">0</span>
                    <span class="stat-card-unit">점</span>
                  </div>
                </div>

                <div class="stat-card">
                  <div class="stat-card-label">퀴즈 응시율</div>
                  <div>
                    <span id="quizAttemptRate" class="stat-card-val">0</span>
                    <span class="stat-card-unit">%</span>
                  </div>
                </div>

                <div class="stat-card">
                  <div class="stat-card-label">AI 코멘트</div>
                  <div>
                    <span id="aiCommentCount" class="stat-card-val">0</span>
                    <span class="stat-card-unit">개</span>
                  </div>
                </div>
              </div>
            </div>

            <div class="chart-wrap">
              <div class="chart-title">점수 분포</div>

              <div class="chart-inner">
                <svg class="donut-svg" width="80" height="80" viewBox="0 0 80 80">
                  <circle cx="40" cy="40" r="30" fill="none" stroke="#f0f0f0" stroke-width="14"/>
                  <g id="scoreChartSegments"></g>
                </svg>

                <div class="legend">
                  <div class="legend-item">
                    <div class="legend-dot" style="background:#4f80f7"></div>
                    90~100점 <span id="legend90">0개 (0%)</span>
                  </div>
                  <div class="legend-item">
                    <div class="legend-dot" style="background:#38bdf8"></div>
                    80~89점 <span id="legend80">0개 (0%)</span>
                  </div>
                  <div class="legend-item">
                    <div class="legend-dot" style="background:#34d399"></div>
                    70~79점 <span id="legend70">0개 (0%)</span>
                  </div>
                  <div class="legend-item">
                    <div class="legend-dot" style="background:#fb923c"></div>
                    ~69점 <span id="legend69">0개 (0%)</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/layout.js}"></script>
<script>
  function getAuthHeader() {
    const token = localStorage.getItem('accessToken');
    return token ? { 'Authorization': 'Bearer ' + token } : {};
  }

  const STUDENT_API = {
    list: '/api/v1/teacher/students',
    quizResults: function (studentId) {
      return '/api/v1/teacher/students/' + studentId + '/quiz-results';
    }
  };

  let students = [];
  let selectedStudentId = null;

  document.addEventListener('DOMContentLoaded', function () {
    loadStudents();

    const searchInput = document.getElementById('studentSearchInput');
    const refreshButton = document.getElementById('refreshStudentBtn');

    if (searchInput) {
      searchInput.addEventListener('input', function () {
        renderStudentList();
      });
    }

    if (refreshButton) {
      refreshButton.addEventListener('click', function () {
        if (!selectedStudentId) {
          alert('학생을 먼저 선택해주세요.');
          return;
        }

        selectStudent(selectedStudentId);
      });
    }
  });

  async function loadStudents() {
    try {
      const response = await fetch(STUDENT_API.list, { headers: getAuthHeader() });

      if (!response.ok) {
        console.error(await response.text());
        renderStudentListError();
        return;
      }

      students = await response.json();
      renderStudentList();

      if (students.length > 0) {
        selectStudent(students[0].studentId);
      } else {
        clearStudentDetail();
      }
    } catch (error) {
      console.error(error);
      renderStudentListError();
    }
  }

  function renderStudentList() {
    const container = document.getElementById('studentList');
    const searchInput = document.getElementById('studentSearchInput');
    const keyword = searchInput ? searchInput.value.trim().toLowerCase() : '';

    if (!container) {
      return;
    }

    const filteredStudents = students.filter(function (student) {
      return String(student.studentName || '').toLowerCase().includes(keyword)
        || String(student.studentNumber || '').toLowerCase().includes(keyword);
    });

    if (filteredStudents.length === 0) {
      container.innerHTML = '<div class="student-list-empty">학생이 없습니다.</div>';
      return;
    }

    container.innerHTML = filteredStudents.map(function (student) {
      const activeClass = Number(student.studentId) === Number(selectedStudentId) ? ' active' : '';

      return '' +
        '<div class="student-item' + activeClass + '" onclick="selectStudent(' + student.studentId + ')">' +
          '<div class="student-avatar">' +
            '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' +
          '</div>' +
          '<div>' +
            '<div class="student-name">' + escapeHtml(student.studentName) + '</div>' +
            '<div class="student-meta">' + escapeHtml(student.studentNumber || '-') + '</div>' +
          '</div>' +
        '</div>';
    }).join('');
  }

  function renderStudentListError() {
    const container = document.getElementById('studentList');

    if (!container) {
      return;
    }

    container.innerHTML = '<div class="student-list-empty">학생 목록을 불러오지 못했습니다.</div>';
  }

  async function selectStudent(studentId) {
    selectedStudentId = studentId;
    renderStudentList();

    try {
      const response = await fetch(STUDENT_API.quizResults(studentId), { headers: getAuthHeader() });

      if (!response.ok) {
        const text = await response.text();
        console.error('[quiz-results] status=' + response.status, text);
        alert('학생 퀴즈 결과를 불러오지 못했습니다. (status: ' + response.status + ')');
        return;
      }

      const data = await response.json();

      renderSelectedStudent(data);
      renderQuizResults(data.quizResults || []);
      renderSummary(data.summary);
    } catch (error) {
      console.error('[quiz-results] catch error:', error);
      alert('학생 퀴즈 결과 조회 중 오류가 발생했습니다.');
    }
  }

  function renderSelectedStudent(data) {
    document.getElementById('selectedStudentName').textContent = data.studentName || '학생';
    document.getElementById('selectedStudentMeta').textContent = data.studentNumber || '-';
  }

  function renderQuizResults(results) {
    const tbody = document.getElementById('quizResultBody');

    if (!tbody) {
      return;
    }

    if (!results.length) {
      tbody.innerHTML = '' +
        '<tr>' +
          '<td colspan="4" style="text-align:center; color:#aaa; padding:30px;">' +
            '아직 제출한 퀴즈가 없습니다.' +
          '</td>' +
        '</tr>';
      return;
    }

    tbody.innerHTML = results.map(function (result) {
      const submittedAt = formatDate(result.submittedAt);
      const score = result.score ?? 0;
      const comment = result.comment || '';

      return '' +
        '<tr>' +
          '<td>' + escapeHtml(result.quizTitle || '제목 없는 퀴즈') + '</td>' +
          '<td>' + escapeHtml(submittedAt) + '</td>' +
          '<td>' +
            '<div class="score-wrap">' +
              '<span class="score-val">' + score + '</span>' +
              '<span class="score-unit">점</span>' +
            '</div>' +
          '</td>' +
          '<td>' +
            '<div class="comment-box">' +
              '<span class="comment-empty">' + escapeHtml(comment) + '</span>' +
            '</div>' +
          '</td>' +
        '</tr>';
    }).join('');
  }

  function renderSummary(summary) {
    if (!summary) {
      summary = {
        submittedQuizCount: 0,
        totalQuizCount: 0,
        averageScore: 0,
        quizAttemptRate: 0,
        aiCommentCount: 0,
        score90Count: 0,
        score80Count: 0,
        score70Count: 0,
        score69Count: 0
      };
    }

    document.getElementById('submittedQuizCount').textContent = summary.submittedQuizCount ?? 0;
    document.getElementById('averageScore').textContent = summary.averageScore ?? 0;
    document.getElementById('quizAttemptRate').textContent = summary.quizAttemptRate ?? 0;
    document.getElementById('aiCommentCount').textContent = summary.aiCommentCount ?? 0;

    renderScoreDistribution(summary);
  }

  function renderScoreDistribution(summary) {
    const score90Count = summary.score90Count ?? 0;
    const score80Count = summary.score80Count ?? 0;
    const score70Count = summary.score70Count ?? 0;
    const score69Count = summary.score69Count ?? 0;

    const total = score90Count + score80Count + score70Count + score69Count;

    setLegendText('legend90', score90Count, total);
    setLegendText('legend80', score80Count, total);
    setLegendText('legend70', score70Count, total);
    setLegendText('legend69', score69Count, total);

    const segmentContainer = document.getElementById('scoreChartSegments');

    if (!segmentContainer) {
      return;
    }

    if (total === 0) {
      segmentContainer.innerHTML = '';
      return;
    }

    const circumference = 188.5;
    let offset = 0;

    const segments = [
      { count: score90Count, color: '#4f80f7' },
      { count: score80Count, color: '#38bdf8' },
      { count: score70Count, color: '#34d399' },
      { count: score69Count, color: '#fb923c' }
    ];

    segmentContainer.innerHTML = segments.map(function (segment) {
      if (segment.count <= 0) {
        return '';
      }

      const length = circumference * (segment.count / total);
      const dashOffset = -offset;

      offset += length;

      return '' +
        '<circle cx="40" cy="40" r="30" fill="none" stroke="' + segment.color + '" stroke-width="14" ' +
        'stroke-dasharray="' + length + ' ' + (circumference - length) + '" ' +
        'stroke-dashoffset="' + dashOffset + '" transform="rotate(-90 40 40)"/>';
    }).join('');
  }

  function setLegendText(elementId, count, total) {
    const element = document.getElementById(elementId);

    if (!element) {
      return;
    }

    const percent = total === 0
      ? 0
      : Math.round((count * 1000) / total) / 10;

    element.textContent = count + '개 (' + percent + '%)';
  }

  function clearStudentDetail() {
    document.getElementById('selectedStudentName').textContent = '학생을 선택해주세요';
    document.getElementById('selectedStudentMeta').textContent = '-';

    const tbody = document.getElementById('quizResultBody');

    if (tbody) {
      tbody.innerHTML = '' +
        '<tr>' +
          '<td colspan="4" style="text-align:center; color:#aaa; padding:30px;">' +
            '학생 목록이 없습니다.' +
          '</td>' +
        '</tr>';
    }

    renderSummary(null);
  }

  function formatDate(value) {
    if (!value) {
      return '-';
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return '-';
    }

    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');

    return year + '.' + month + '.' + day;
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }
  
function goReportPage() {
  if (!selectedStudentId) {
    alert('학생을 먼저 선택해주세요.');
    return;
  }

  location.href = '/student/report?studentId=' + encodeURIComponent(selectedStudentId);
}
  
</script>
</body>
</html>
