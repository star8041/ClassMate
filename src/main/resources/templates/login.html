<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - ClassMate</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #F0F2F5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            display: flex;
            width: 760px;
            min-height: 480px;
            overflow: hidden;
        }

        /* 왼쪽 일러스트 영역 */
        .illust {
            width: 260px;
            background: linear-gradient(145deg, #EFF6FF 0%, #DBEAFE 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .illust svg { width: 160px; height: 160px; }

        /* 오른쪽 폼 영역 */
        .form-area {
            flex: 1;
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
        }

        .brand { text-align: center; margin-bottom: 22px; }
        .brand h1 { font-size: 26px; font-weight: 700; color: #2563EB; letter-spacing: -0.5px; }
        .brand p  { font-size: 13px; color: #6B7280; margin-top: 4px; }

        /* 선생님/학생 선택 토글 */
        .role-toggle {
            position: relative;
            display: grid; grid-template-columns: 1fr 1fr; gap: 0;
            background: #F1F3F9; border-radius: 12px; padding: 4px; margin-bottom: 24px;
        }
        .role-thumb {
            position: absolute; top: 4px; left: 4px;
            width: calc(50% - 4px); height: calc(100% - 8px);
            background: #fff; border-radius: 9px; box-shadow: 0 1px 5px rgba(37,99,235,0.18);
            transition: transform 0.25s ease; z-index: 0;
        }
        .role-thumb.student { transform: translateX(100%); }
        .role-option {
            position: relative; z-index: 1;
            border: none; background: transparent; cursor: pointer;
            padding: 11px 0; font-size: 14px; font-weight: 600; color: #8A93A3;
            display: flex; align-items: center; justify-content: center; gap: 7px;
            border-radius: 9px; transition: color 0.2s;
        }
        .role-option.active { color: #2563EB; }

        /* 학생 초대코드 입력 */
        .code-input {
            text-align: center; font-size: 28px; font-weight: 700;
            letter-spacing: 14px; padding-left: 14px !important;
            font-family: 'Menlo', 'Consolas', monospace; color: #1a2b4a;
        }

        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }

        .field input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            font-size: 14px;
            color: #111827;
            outline: none;
            transition: border-color 0.2s;
        }
        .field input:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,0.10); }
        .field input::placeholder { color: #9CA3AF; }

        .pw-wrap { position: relative; }
        .pw-wrap input { padding-right: 40px; }
        .pw-toggle {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; color: #9CA3AF; padding: 0;
        }

        .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }

        .checkbox-label {
            display: flex; align-items: center; gap: 6px;
            font-size: 13px; color: #6B7280; cursor: pointer;
        }
        .checkbox-label input[type=checkbox] { accent-color: #2563EB; width: 15px; height: 15px; }

        .link { font-size: 13px; color: #2563EB; text-decoration: none; }
        .link:hover { text-decoration: underline; }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #2563EB;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #1D4ED8; }
        .btn-primary:disabled { background: #93C5FD; cursor: not-allowed; }

        .divider { text-align: center; margin: 16px 0; font-size: 13px; color: #9CA3AF; }

        .signup-row { text-align: center; margin-top: 16px; font-size: 13px; color: #6B7280; }

        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .alert-error { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; }
        .alert-success { background: #F0FDF4; color: #16A34A; border: 1px solid #BBF7D0; }
    </style>
</head>
<body>

<div class="card">
    <!-- 일러스트 -->
    <div class="illust">
        <svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- 책 더미 -->
            <rect x="30" y="100" width="80" height="14" rx="4" fill="#BFDBFE"/>
            <rect x="35" y="86" width="70" height="16" rx="4" fill="#93C5FD"/>
            <rect x="40" y="70" width="60" height="18" rx="4" fill="#60A5FA"/>
            <rect x="45" y="55" width="50" height="17" rx="4" fill="#3B82F6"/>
            <!-- 연필들 -->
            <rect x="105" y="55" width="8" height="50" rx="3" fill="#FCD34D" transform="rotate(-10 105 55)"/>
            <rect x="118" y="50" width="8" height="55" rx="3" fill="#6EE7B7" transform="rotate(5 118 50)"/>
            <rect x="128" y="58" width="8" height="48" rx="3" fill="#FCA5A5" transform="rotate(-5 128 58)"/>
            <!-- 컵 -->
            <rect x="100" y="100" width="34" height="26" rx="4" fill="#E5E7EB"/>
            <rect x="103" y="103" width="28" height="20" rx="3" fill="#F3F4F6"/>
        </svg>
    </div>

    <!-- 폼 -->
    <div class="form-area">
        <div class="brand">
            <h1>ClassMate</h1>
            <p id="roleHint">교사용 AI 업무 비서</p>
        </div>

        <!-- 선생님 / 학생 선택 -->
        <div class="role-toggle">
            <span class="role-thumb" id="roleThumb"></span>
            <button type="button" class="role-option active" data-role="teacher" onclick="selectRole('teacher')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                선생님
            </button>
            <button type="button" class="role-option" data-role="student" onclick="selectRole('student')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                학생
            </button>
        </div>

        <div class="alert alert-error" id="errorMsg"></div>

        <!-- ── 선생님: 아이디/비밀번호 ── -->
        <div id="teacherForm">
            <div class="field">
                <label for="loginId">아이디</label>
                <input type="text" id="loginId" placeholder="아이디를 입력하세요">
            </div>

            <div class="field">
                <label for="password">비밀번호</label>
                <div class="pw-wrap">
                    <input type="password" id="password" placeholder="비밀번호를 입력하세요">
                    <button type="button" class="pw-toggle" onclick="togglePassword('password', this)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="row">
                <label class="checkbox-label">
                    <input type="checkbox" id="rememberMe"> 로그인 상태 유지
                </label>
                <a href="/signup" class="link">비밀번호 찾기</a>
            </div>

            <button class="btn-primary" id="loginBtn" onclick="doLogin()">로그인</button>

            <div class="signup-row">
                계정이 없으신가요? <a href="/signup" class="link">회원가입</a>
            </div>
        </div>

        <!-- ── 학생: 초대 코드 ── -->
        <div id="studentForm" style="display:none">
            <div class="field">
                <label for="inviteCode">초대 코드</label>
                <input type="text" id="inviteCode" class="code-input" placeholder="••••••"
                       maxlength="6" inputmode="numeric" autocomplete="off">
            </div>

            <button class="btn-primary" id="studentBtn" onclick="doStudentLogin()">입장하기</button>

            <div class="signup-row">
                선생님께 받은 <b>6자리 코드</b>를 입력하세요. (발급 후 10분간 유효)
            </div>
        </div>
    </div>
</div>

<script>
    // 선생님 / 학생 선택
    let selectedRole = 'teacher';
    function selectRole(role) {
        selectedRole = role;
        document.querySelectorAll('.role-option').forEach(b =>
            b.classList.toggle('active', b.dataset.role === role));
        document.getElementById('roleThumb').classList.toggle('student', role === 'student');
        document.getElementById('roleHint').textContent =
            role === 'student' ? '학생 학습 공간' : '교사용 AI 업무 비서';
        document.getElementById('teacherForm').style.display = role === 'student' ? 'none' : 'block';
        document.getElementById('studentForm').style.display = role === 'student' ? 'block' : 'none';
        hideError();
    }
    // JWT payload 의 role 클레임 추출 (ADMIN/TEACHER)
    function decodeRole(token) {
        try {
            const b64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            const json = decodeURIComponent(Array.prototype.map.call(atob(b64),
                c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
            return JSON.parse(json).role;
        } catch (e) { return null; }
    }
    function roleDest() {
        return selectedRole === 'student' ? '/quiz/student' : '/teacher/dashboard';
    }

    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        btn.style.color = isHidden ? '#2563EB' : '#9CA3AF';
    }

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.style.display = 'block';
    }

    function hideError() {
        document.getElementById('errorMsg').style.display = 'none';
    }

    // 이미 로그인된 경우 마지막 선택한 화면으로
    if (localStorage.getItem('accessToken')) {
        location.href = localStorage.getItem('loginRole') === 'student' ? '/quiz/student' : '/teacher/dashboard';
    }

    // 엔터키 로그인
    document.addEventListener('keydown', e => {
        if (e.key === 'Enter') { selectedRole === 'student' ? doStudentLogin() : doLogin(); }
    });

    async function doLogin() {
        hideError();
        const loginId  = document.getElementById('loginId').value.trim();
        const password = document.getElementById('password').value;

        if (!loginId)  { showError('아이디를 입력해 주세요.'); return; }
        if (!password) { showError('비밀번호를 입력해 주세요.'); return; }

        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = '로그인 중...';

        try {
            const res = await fetch('/api/v1/teacher-auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ loginId, password })
            });

            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('accessToken', data.accessToken);
                localStorage.setItem('tokenType', data.tokenType ?? 'Bearer');
                if (document.getElementById('rememberMe').checked) {
                    localStorage.setItem('rememberLogin', 'true');
                }
                // 관리자(ADMIN)면 전용 선택 화면으로, 일반 교사는 바로 대시보드로
                if (decodeRole(data.accessToken) === 'ADMIN') {
                    localStorage.removeItem('loginRole');
                    location.href = '/admin/select';
                } else {
                    localStorage.setItem('loginRole', 'teacher');
                    location.href = '/teacher/dashboard';
                }
            } else {
                const err = await res.json().catch(() => ({}));
                showError(err.message ?? '아이디 또는 비밀번호가 올바르지 않습니다.');
            }
        } catch (e) {
            showError('서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.');
        } finally {
            btn.disabled = false;
            btn.textContent = '로그인';
        }
    }

    // 학생: 초대 코드로 입장
    async function doStudentLogin() {
        hideError();
        const code = document.getElementById('inviteCode').value.trim();
        if (!/^\d{6}$/.test(code)) { showError('6자리 숫자 코드를 입력해 주세요.'); return; }

        const btn = document.getElementById('studentBtn');
        btn.disabled = true;
        btn.textContent = '확인 중...';

        try {
            const res = await fetch('/api/v1/students/verify-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code })
            });
            const data = await res.json().catch(() => ({}));

            if (res.ok && data.valid) {
                localStorage.setItem('loginRole', 'student');
                localStorage.setItem('studentTeacherId', data.teacherId);
                localStorage.setItem('studentTeacherName', data.teacherName ?? '');
                localStorage.setItem('inviteCode', code);
                location.href = '/quiz/student';
            } else {
                showError(data.message ?? '유효하지 않거나 만료된 코드입니다.');
            }
        } catch (e) {
            showError('서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.');
        } finally {
            btn.disabled = false;
            btn.textContent = '입장하기';
        }
    }
</script>
</body>
</html>
