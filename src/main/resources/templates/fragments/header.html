<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header(userName, profileImgUrl)" id="main-header">

  <div class="header-actions">

    <!-- 초대코드 영역 -->
    <div id="inviteBody">
      <button class="invite-gen-btn" onclick="generateInvite()">코드 생성</button>
    </div>

    <!-- 관리자 전용: 화면 전환 버튼 (관리자 토큰일 때만 표시) -->
    <button id="adminSwitchBtn" type="button" class="admin-switch" style="display:none;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      <span id="adminSwitchLabel">학생 화면으로 전환</span>
    </button>

    <!-- 사용자 이름 -->
    <span class="header-username" id="headerUserName">
      <span th:text="${userName}">김민지</span>
      <!-- <span th:text="#{header.user.suffix}">선생님</span> -->
    </span>

    <!-- 로그아웃 -->
    <a th:href="@{/members/logout}" class="header-logout-btn">로그아웃</a>

  </div>

  <style>
    .admin-switch {
      display: inline-flex; align-items: center; gap: 7px;
      border: none; cursor: pointer; padding: 8px 14px; border-radius: 8px;
      font-size: 13px; font-weight: 600; font-family: inherit; color: #fff; white-space: nowrap;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      box-shadow: 0 4px 12px rgba(99,102,241,.35);
      transition: transform .15s, box-shadow .15s;
    }
    .admin-switch:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(99,102,241,.45); }
    .admin-switch:active { transform: translateY(0); }
    .admin-switch svg { flex-shrink: 0; }
  </style>
  <script th:inline="none">
    (function () {
      var token = localStorage.getItem('accessToken');
      var payload = null;
      if (token) {
        try {
          var b64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
          payload = JSON.parse(decodeURIComponent(escape(atob(b64))));
        } catch (e) { payload = null; }
      }
      var role = payload ? payload.role : null;
      var name = payload ? (payload.name || payload.sub) : null;

      // JWT의 이름으로 헤더 표기 업데이트
      if (name) {
        var el = document.getElementById('headerUserName');
        if (el) el.textContent = name + ' 선생님';
      }

      // 관리자 전용 화면 전환 버튼
      var btn = document.getElementById('adminSwitchBtn');
      if (btn) {
        if (role !== 'ADMIN') {
          btn.remove();
        } else {
          var onStudent = location.pathname.indexOf('/student') === 0;
          var label = document.getElementById('adminSwitchLabel');
          if (label) label.textContent = onStudent ? '선생님 화면으로 전환' : '학생 화면으로 전환';
          btn.style.display = 'inline-flex';
          btn.addEventListener('click', function () {
            if (onStudent) { localStorage.setItem('loginRole', 'teacher'); location.href = '/teacher/dashboard'; }
            else { localStorage.setItem('loginRole', 'student'); location.href = '/student/home'; }
          });
        }
      }
    })();
  </script>
</header>
</body>
</html>
