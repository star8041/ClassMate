<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퀴즈 - ClassMate</title>
<style>
  .page-title { font-size: 30px; font-weight: 800; }
  .page-sub { color: #8A93A3; margin: 8px 0 24px; }

  .stat-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; margin-bottom: 22px; }
  .stat { background: #fff; border: 1px solid #EEF1F6; border-radius: 16px; padding: 22px 24px; display: flex; align-items: center; gap: 16px; }
  .stat .ic { width: 52px; height: 52px; border-radius: 14px; display:flex; align-items:center; justify-content:center; }
  .stat .l { font-size: 14px; color: #8A93A3; }
  .stat .v { font-size: 24px; font-weight: 800; }
  .stat .v small { font-size: 14px; font-weight: 600; color: #8A93A3; }

  .toolbar { background: #fff; border: 1px solid #EEF1F6; border-radius: 16px; padding: 14px 18px; display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .tab { border: none; background: transparent; padding: 8px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; color: #6B7280; cursor: pointer; }
  .tab.on { background: #2563EB; color: #fff; }
  .search { margin-left: auto; display: flex; align-items: center; gap: 8px; background: #F4F6FA; border-radius: 10px; padding: 9px 14px; width: 280px; }
  .search input { border: none; outline: none; background: transparent; font-size: 14px; width: 100%; font-family: inherit; }

  .list { background: #fff; border: 1px solid #EEF1F6; border-radius: 16px; overflow: hidden; }
  .qrow { display: flex; align-items: center; gap: 18px; padding: 20px 22px; border-bottom: 1px solid #F2F4F8; }
  .qrow:last-child { border-bottom: none; }
  .subj { width: 56px; text-align: center; font-size: 13px; font-weight: 700; padding: 7px 0; border-radius: 10px; flex-shrink: 0; }
  .qinfo { flex: 1; min-width: 0; }
  .qtitle { font-size: 16px; font-weight: 700; }
  .qmeta { display: flex; gap: 14px; margin-top: 6px; font-size: 13px; color: #9AA3B2; }
  .qmeta .due-today { color: #EF4444; font-weight: 600; }
  .badge { font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 18px; }
  .b-ing { background: #E8F0FE; color: #2563EB; }
  .b-soon { background: #FEF3E2; color: #E08A1E; }
  .b-done { background: #E7F6EC; color: #1F9D55; }
  .act { width: 92px; text-align: center; border: none; border-radius: 12px; padding: 11px 0; font-size: 14px; font-weight: 700; cursor: pointer; }
  .a-solve { background: #2563EB; color: #fff; }
  .a-wait { background: #fff; border: 1px solid #D7DCE5; color: #9AA3B2; cursor: not-allowed; }
  .a-result { background: #fff; border: 1px solid #C9D6F5; color: #2563EB; }
  .empty { padding: 40px; text-align: center; color: #aaa; }
</style>
</head>
<body>
<div class="s-wrap">
  <div th:replace="~{fragments/student-sidebar :: studentSidebar('quiz')}"></div>
  <main class="s-main">
    <h1 class="page-title">퀴즈</h1>
    <p class="page-sub">선생님이 올린 퀴즈를 확인하고 풀어보세요.</p>

    <div class="stat-row">
      <div class="stat"><span class="ic" style="background:#E8F0FE"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg></span><div><div class="l">진행 중</div><div class="v" id="cntIng">0 <small>개</small></div></div></div>
      <div class="stat"><span class="ic" style="background:#FEF3E2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E08A1E" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span><div><div class="l">예정</div><div class="v" id="cntSoon">0 <small>개</small></div></div></div>
      <div class="stat"><span class="ic" style="background:#E7F6EC"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F9D55" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/></svg></span><div><div class="l">완료</div><div class="v" id="cntDone">0 <small>개</small></div></div></div>
    </div>

    <div class="toolbar">
      <button class="tab on" data-filter="all" onclick="setFilter(this)">전체</button>
      <button class="tab" data-filter="ing" onclick="setFilter(this)">진행 중</button>
      <button class="tab" data-filter="soon" onclick="setFilter(this)">예정</button>
      <button class="tab" data-filter="done" onclick="setFilter(this)">완료</button>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA3B2" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchBox" placeholder="퀴즈 제목 검색" oninput="render()">
      </div>
    </div>

    <div class="list" id="list"></div>
  </main>
</div>

<script>
  var SUBJ = {
    국어: { bg:'#E8EEFF', c:'#3F62D6' },
    수학: { bg:'#E5F7EC', c:'#22A65A' },
    과학: { bg:'#EFE8FE', c:'#7C4DD6' },
    영어: { bg:'#FFF1DD', c:'#D98A20' },
    사회: { bg:'#FDE7E7', c:'#D9534F' },
    퀴즈: { bg:'#EEF1F6', c:'#6B7280' }
  };

  var STATUS = {
    ing: { t:'진행 중', c:'b-ing' },
    soon: { t:'예정', c:'b-soon' },
    done: { t:'종료', c:'b-done' }
  };

  var QUIZZES = [];
  var filter = 'all';

  document.addEventListener('DOMContentLoaded', function () {
    loadQuizzes();
  });

  async function loadQuizzes() {
    try {
      var response = await fetch('/api/v1/quizzes');

      if (!response.ok) {
        console.error(await response.text());
        document.getElementById('list').innerHTML =
          '<div class="empty">퀴즈 목록을 불러오지 못했어요.</div>';
        return;
      }

      var data = await response.json();

      // API가 배열로 내려오는 경우와 ApiResponse 형태로 내려오는 경우 둘 다 대응
      var quizzes = Array.isArray(data)
        ? data
        : (data.data || data.result || data.quizzes || []);

      QUIZZES = quizzes.map(function (quiz) {
        return toViewQuiz(quiz);
      });

      render();
    } catch (error) {
      console.error(error);
      document.getElementById('list').innerHTML =
        '<div class="empty">퀴즈 목록을 불러오는 중 오류가 발생했어요.</div>';
    }
  }

  function toViewQuiz(quiz) {
    var now = new Date();

    var availableFrom = quiz.availableFrom ? new Date(quiz.availableFrom) : null;
    var availableUntil = quiz.availableUntil ? new Date(quiz.availableUntil) : null;

    var status = getQuizStatus(now, availableFrom, availableUntil);

    return {
      quizId: quiz.quizId,
      subj: inferSubject(quiz.title),
      title: quiz.title || '제목 없는 퀴즈',
      q: quiz.questionCount ?? quiz.questions?.length ?? 0,
      min: getMinuteLimit(availableFrom, availableUntil),
      due: getDueText(now, availableFrom, availableUntil, status),
      dueToday: isToday(availableUntil),
      status: status,
      availableFrom: availableFrom,
      availableUntil: availableUntil
    };
  }

  function getQuizStatus(now, availableFrom, availableUntil) {
    if (availableFrom && now < availableFrom) {
      return 'soon';
    }

    if (availableUntil && now > availableUntil) {
      return 'done';
    }

    return 'ing';
  }

  function getMinuteLimit(availableFrom, availableUntil) {
    if (!availableFrom || !availableUntil) {
      return '-';
    }

    var diffMs = availableUntil.getTime() - availableFrom.getTime();
    var diffMin = Math.round(diffMs / 1000 / 60);

    if (diffMin <= 0) {
      return '-';
    }

    return diffMin;
  }

  function getDueText(now, availableFrom, availableUntil, status) {
    if (status === 'soon') {
      if (!availableFrom) {
        return '예정';
      }

      if (isToday(availableFrom)) {
        return '오늘 시작';
      }

      if (isTomorrow(availableFrom)) {
        return '내일 시작';
      }

      return formatMonthDay(availableFrom) + ' 시작';
    }

    if (status === 'done') {
      return '종료';
    }

    if (!availableUntil) {
      return '상시';
    }

    if (isToday(availableUntil)) {
      return '오늘 마감';
    }

    if (isTomorrow(availableUntil)) {
      return '내일 마감';
    }

    return formatMonthDay(availableUntil) + ' 마감';
  }

  function inferSubject(title) {
    if (!title) {
      return '퀴즈';
    }

    if (title.indexOf('국어') > -1) return '국어';
    if (title.indexOf('수학') > -1) return '수학';
    if (title.indexOf('과학') > -1) return '과학';
    if (title.indexOf('영어') > -1) return '영어';
    if (title.indexOf('사회') > -1) return '사회';

    return '퀴즈';
  }

  function setFilter(btn) {
    filter = btn.dataset.filter;

    document.querySelectorAll('.tab').forEach(function (tab) {
      tab.classList.toggle('on', tab === btn);
    });

    render();
  }

  function actBtn(q) {
    if (q.status === 'ing') {
      return '<button class="act a-solve" onclick="goSolve(' + q.quizId + ')">풀기</button>';
    }

    if (q.status === 'soon') {
      return '<button class="act a-wait" disabled>대기</button>';
    }

    return '<button class="act a-result" onclick="alert(\'종료된 퀴즈입니다.\')">종료</button>';
  }

  function render() {
    var searchBox = document.getElementById('searchBox');
    var kw = searchBox ? searchBox.value.trim() : '';

    var list = document.getElementById('list');

    var rows = QUIZZES.filter(function (q) {
      var matchesFilter = filter === 'all' || q.status === filter;
      var matchesKeyword = !kw || q.title.indexOf(kw) > -1;

      return matchesFilter && matchesKeyword;
    });

    if (!rows.length) {
      list.innerHTML = '<div class="empty">해당하는 퀴즈가 없어요.</div>';
    } else {
      list.innerHTML = rows.map(function (q) {
        var s = SUBJ[q.subj] || SUBJ['퀴즈'];
        var st = STATUS[q.status];
        var due = q.dueToday && q.status === 'ing'
          ? '<span class="due-today">📅 ' + q.due + '</span>'
          : '📅 ' + q.due;

        var minuteText = q.min === '-' ? '-' : q.min + '분';

        return '<div class="qrow">' +
          '<span class="subj" style="background:' + s.bg + ';color:' + s.c + '">' + escapeHtml(q.subj) + '</span>' +
          '<div class="qinfo">' +
            '<div class="qtitle">' + escapeHtml(q.title) + '</div>' +
            '<div class="qmeta">' +
              '<span>📄 ' + q.q + '문제</span>' +
              '<span>⏱ ' + minuteText + '</span>' +
              '<span>' + due + '</span>' +
            '</div>' +
          '</div>' +
          '<span class="badge ' + st.c + '">' + st.t + '</span>' +
          actBtn(q) +
        '</div>';
      }).join('');
    }

    document.getElementById('cntIng').innerHTML =
      QUIZZES.filter(function(q) { return q.status === 'ing'; }).length + ' <small>개</small>';

    document.getElementById('cntSoon').innerHTML =
      QUIZZES.filter(function(q) { return q.status === 'soon'; }).length + ' <small>개</small>';

    document.getElementById('cntDone').innerHTML =
      QUIZZES.filter(function(q) { return q.status === 'done'; }).length + ' <small>개</small>';
  }

  function goSolve(quizId) {
    location.href = '/student/quiz/solve?quizId=' + encodeURIComponent(quizId);
  }

  function isToday(date) {
    if (!date) {
      return false;
    }

    var now = new Date();

    return date.getFullYear() === now.getFullYear()
      && date.getMonth() === now.getMonth()
      && date.getDate() === now.getDate();
  }

  function isTomorrow(date) {
    if (!date) {
      return false;
    }

    var tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);

    return date.getFullYear() === tomorrow.getFullYear()
      && date.getMonth() === tomorrow.getMonth()
      && date.getDate() === tomorrow.getDate();
  }

  function formatMonthDay(date) {
    if (!date) {
      return '';
    }

    var month = String(date.getMonth() + 1).padStart(2, '0');
    var day = String(date.getDate()).padStart(2, '0');

    return month + '.' + day;
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }
</script>

</body>
</html>
