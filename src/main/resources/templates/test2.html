<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ClassMate – Layout Preview</title>
<style>
/* ── 디자인 토큰 ── */
:root {
  --cm-blue: #4A7CF7;
  --cm-blue-light: #EEF3FE;
  --cm-white: #FFFFFF;
  --cm-bg: #F5F7FB;
  --cm-sidebar-bg: #FFFFFF;
  --cm-border: #E8ECF4;
  --cm-text-primary: #1A2340;
  --cm-text-secondary: #6B7A99;
  --cm-text-muted: #9DAABB;
  --sidebar-w: 200px;
  --header-h: 60px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --transition: 0.18s ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard', 'Noto Sans KR', -apple-system, sans-serif;
  background: var(--cm-bg);
  color: var(--cm-text-primary);
  font-size: 14px;
}
a { text-decoration: none; color: inherit; }
ul { list-style: none; }
button { cursor: pointer; }

/* LAYOUT */
.layout-wrapper { display: flex; min-height: 100vh; }
.layout-main { margin-left: var(--sidebar-w); padding-top: var(--header-h); flex: 1; }
.page-body { padding: 28px 30px; }

/* SIDEBAR */
#sidebar {
  position: fixed; top: 0; left: 0;
  width: var(--sidebar-w); height: 100vh;
  background: var(--cm-sidebar-bg);
  border-right: 1px solid var(--cm-border);
  display: flex; flex-direction: column;
  overflow-y: auto; z-index: 300;
}
.sidebar-menu { padding: 12px 0; flex: 1; }
.sidebar-menu li > a {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 20px; font-size: 14px; font-weight: 500;
  color: var(--cm-text-secondary);
  transition: color var(--transition), background var(--transition);
  position: relative;
}
.sidebar-menu li > a:hover { color: var(--cm-blue); background: var(--cm-blue-light); }
.sidebar-menu li.active > a {
  color: var(--cm-blue); background: var(--cm-blue-light); font-weight: 600;
}
.sidebar-menu li.active > a::before {
  content: ''; position: absolute; left: 0; top: 6px; bottom: 6px;
  width: 3px; background: var(--cm-blue); border-radius: 0 3px 3px 0;
}
.sidebar-icon { display: flex; align-items: center; flex-shrink: 0; opacity: 0.6; transition: opacity var(--transition); }
.sidebar-menu li.active > a .sidebar-icon,
.sidebar-menu li > a:hover .sidebar-icon { opacity: 1; }
.sidebar-divider-item { height: 1px; background: var(--cm-border); margin: 8px 16px; pointer-events: none; }

/* HEADER */
#main-header {
  position: fixed; top: 0; left: var(--sidebar-w); right: 0;
  height: var(--header-h); background: var(--cm-white);
  border-bottom: 1px solid var(--cm-border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px 0 24px; z-index: 200;
}
.header-logo-link { display: flex; align-items: center; gap: 9px; }
.header-logo-icon {
  width: 36px; height: 36px; background: var(--cm-blue);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
}
.header-logo-text { font-size: 17px; font-weight: 800; letter-spacing: -0.4px; }
.header-actions { display: flex; align-items: center; gap: 14px; }
.header-noti-wrap { position: relative; }
.header-noti-btn {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: var(--radius-sm);
  color: var(--cm-text-secondary);
  transition: background var(--transition), color var(--transition);
}
.header-noti-btn:hover { background: var(--cm-blue-light); color: var(--cm-blue); }
.noti-badge {
  position: absolute; top: 2px; right: 2px;
  min-width: 17px; height: 17px; line-height: 17px;
  text-align: center; padding: 0 4px;
  background: #E53935; color: #fff;
  border-radius: 9px; font-size: 10px; font-weight: 700;
  border: 2px solid #fff;
}
.header-profile { position: relative; }
.header-profile-btn {
  display: flex; align-items: center; gap: 8px;
  background: none; border: none; padding: 4px 8px;
  border-radius: var(--radius-sm); transition: background var(--transition);
}
.header-profile-btn:hover { background: var(--cm-blue-light); }
.header-avatar {
  width: 32px; height: 32px; border-radius: 50%; overflow: hidden;
  background: linear-gradient(135deg, var(--cm-blue), #7FA8FB);
  display: flex; align-items: center; justify-content: center;
}
.header-avatar-img { width: 100%; height: 100%; object-fit: cover; }
.header-avatar-initial { font-size: 13px; font-weight: 700; color: #fff; }
.header-username { font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.header-chevron { color: var(--cm-text-muted); }
.profile-dropdown-menu {
  position: absolute; top: calc(100% + 8px); right: 0; min-width: 160px;
  background: var(--cm-white); border: 1px solid var(--cm-border);
  border-radius: var(--radius-md); box-shadow: 0 8px 24px rgba(0,0,0,0.10);
  overflow: hidden; z-index: 400;
}
.profile-dropdown-menu li > a {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 16px; font-size: 13px; color: var(--cm-text-primary);
  transition: background var(--transition);
}
.profile-dropdown-menu li > a:hover { background: var(--cm-blue-light); color: var(--cm-blue); }
.dropdown-divider { height: 1px; background: var(--cm-border); margin: 4px 0; }
.dropdown-logout { color: #E53935 !important; }
.dropdown-logout:hover { background: #FFF0F0 !important; }
.header-logout-btn {
  display: inline-flex; align-items: center;
  padding: 7px 16px; background: var(--cm-white);
  border: 1px solid var(--cm-border); border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600; color: var(--cm-text-primary);
  transition: background var(--transition), border-color var(--transition);
}
.header-logout-btn:hover { background: #FFF0F0; border-color: #FFCDD2; color: #E53935; }

/* page placeholder */
.page-placeholder {
  background: var(--cm-white); border-radius: var(--radius-md);
  border: 1px solid var(--cm-border);
  height: 400px;
  display: flex; align-items: center; justify-content: center;
  color: var(--cm-text-muted); font-size: 13px;
}
</style>
</head>
<body>

          </div>

        </a>

      <div class="header-actions">

          <a href="#" class="header-noti-btn">

        <div class="header-profile" id="profileDropdown">

</div>

<script>
function toggleProfileMenu() {
  const menu = document.getElementById('profileMenu');
  if (!menu) return;
  const isOpen = menu.style.display !== 'none';
  menu.style.display = isOpen ? 'none' : 'block';
}
document.addEventListener('click', (e) => {
  const profile = document.getElementById('profileDropdown');
  const menu    = document.getElementById('profileMenu');
  if (!profile || !menu) return;
  if (!profile.contains(e.target)) menu.style.display = 'none';
});
</script>
