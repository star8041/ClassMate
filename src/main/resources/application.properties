spring.application.name=classmate

spring.messages.basename=i18n/message

# ===== RDB (PostgreSQL) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/classmate
spring.datasource.username=classmate
spring.datasource.password=classmate1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== 파일 업로드 제한 =====
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===== 강의자료(PDF) 저장 경로 =====
app.material.upload-dir=uploads/materials

# ===== JWT =====
# TODO: 운영 시 환경변수/시크릿으로 분리할 것 (개발용 기본값)
app.jwt.secret=classmate-dev-secret-key-please-change-in-production-0123456789
app.jwt.expiration-ms=86400000

# ===== 초대코드 (인메모리, 임시) =====
app.invite-code.ttl-minutes=10

# ===== 에러 응답: stacktrace 비노출 (메시지만) =====
spring.web.error.include-stacktrace=never
spring.web.error.include-message=always

# ===== Spring AI (OpenAI) =====
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.embedding.options.model=text-embedding-3-small

# ===== Vector DB (pgvector) =====
spring.ai.vectorstore.pgvector.url=jdbc:postgresql://localhost:5433/classmate_vector
spring.ai.vectorstore.pgvector.username=classmate
spring.ai.vectorstore.pgvector.password=classmate1234
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.initialize-schema=false

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000