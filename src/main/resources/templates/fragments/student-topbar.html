<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 학생 페이지 공통 상단바. <main class="s-main"> 의 첫 자식으로 넣어 사용 -->
<th:block th:fragment="studentTopbar">
  <style>
    /* s-main 패딩(36 44)을 상쇄해 상단바를 전체폭으로 */
    .s-topbar {
      display: flex; align-items: center; justify-content: flex-end; gap: 12px;
      height: 62px; background: #fff; border-bottom: 1px solid #EEF1F6;
      margin: -36px -44px 28px; padding: 0 28px;
    }
    .s-topbar .stb-me { display: flex; align-items: center; gap: 10px; }
    .s-topbar .stb-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, #a5c8ff, #dbe8ff);
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .s-topbar .stb-name { font-weight: 700; font-size: 14px; }
    .s-topbar .stb-grade {
      background: #EAF1FE; color: #2563EB; font-size: 12px; font-weight: 700;
      padding: 4px 10px; border-radius: 20px;
    }
    .s-topbar .stb-logout {
      display: flex; align-items: center; gap: 6px;
      color: #6B7280; font-size: 14px; font-weight: 600; text-decoration: none;
    }
    .s-topbar .stb-logout:hover { color: #2563EB; }
    
    .student-name-badge { font-size: 15px; font-weight: 700; color: var(--text); }
    .student-name-badge span { color: #9AA3B2; font-weight: 500; font-size: 13px; margin-left: 3px; }
  	.student-role {
	  color: #9AA3B2;
	  font-weight: 500;
	  font-size: 13px;
	  margin-left: 3px;
	}
  	.logout-btn {
	  display: inline-flex;
	  align-items: center;
	  gap: 6px;
	  padding: 8px 14px;
	  background: #fff;
	  border: 1px solid #E8ECF4;
	  border-radius: 8px;
	  color: #1A2340;
	  font-size: 13px;
	  font-weight: 600;
	  text-decoration: none;
	  transition: background .18s, border-color .18s, color .18s;
	}

	.logout-btn:hover {
	  background: #FFF0F0;
	  border-color: #FFCDD2;
	  color: #E53935;
	}
  </style>
  <!-- class="topbar" 도 같이 부여 → 학생 사이드바의 전환버튼 재배치 로직이 이 곳으로 이동 -->
  <div class="s-topbar topbar">
    <span class="student-name-badge" id="studentName">학생<span class="student-role">학생</span></span>
    <a href="/members/logout" class="logout-btn">
	  <svg width="15" height="15" viewBox="0 0 24 24"
	       fill="none" stroke="currentColor" stroke-width="2">
	    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
	    <polyline points="16 17 21 12 16 7"/>
	    <line x1="21" y1="12" x2="9" y2="12"/>
	  </svg>
	  로그아웃
	</a>
    
  </div>
  <script>
    (function () {
      function fixEncoding(str) {
    	try {
    	  return decodeURIComponent(escape(str));
    	} catch(e) {
    		return str;
    	}
      }
    	
      var token = localStorage.getItem('accessToken');
      var payload = null;
      if (token) {
        try {
          var b64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
          /* payload = JSON.parse(decodeURIComponent(escape(atob(b64)))); */
          payload = JSON.parse(decodeURIComponent(atob(b64).split('').map(function(c){ return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2); }).join('')));
        } catch (e) { payload = null; }
      } else {
    	  location.href = '/login';
      }
      
      var nm = document.getElementById('studentName');
      var gr = document.getElementById('studentGrade');
      var av = document.getElementById('stbAvatar');
      if (payload && payload.role === 'ADMIN') {
        // 관리자가 학생 화면을 둘러보는 경우 → '관리자'로 표기
        if (nm) nm.innerHTML = fixEncoding(payload.name || '관리자') + '<span class="student-role"> 학생</span>';
        if (gr) gr.textContent = '관리자 모드';
        if (av) av.textContent = '🛡️';
      } else {
        var sn = payload?.name || localStorage.getItem('studentName') || '학생';
        if (sn && nm) nm.innerHTML = fixEncoding(sn) + '<span class="student-role"> 학생</span>';
      }
    })();
  </script>
</th:block>
</body>
</html>
