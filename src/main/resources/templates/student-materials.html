<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의자료 - ClassMate</title>
<style>
  .page-title { font-size: 30px; font-weight: 800; }
  .page-sub { color: #8A93A3; margin: 8px 0 24px; }

  .toolbar { background: #fff; border: 1px solid #EEF1F6; border-radius: 16px; padding: 14px 18px; display: flex; align-items: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab { border: none; background: transparent; padding: 8px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; color: #6B7280; cursor: pointer; }
  .tab.on { background: #2563EB; color: #fff; }
  .search { margin-left: auto; display: flex; align-items: center; gap: 8px; background: #F4F6FA; border-radius: 10px; padding: 9px 14px; width: 260px; }
  .search input { border: none; outline: none; background: transparent; font-size: 14px; width: 100%; font-family: inherit; }

  .list { background: #fff; border: 1px solid #EEF1F6; border-radius: 16px; overflow: hidden; }
  .lhead, .lrow { display: grid; grid-template-columns: 78px 1fr 120px 184px; align-items: center; gap: 16px; padding: 16px 22px; }
  .lhead { color: #9AA3B2; font-size: 13px; border-bottom: 1px solid #EEF1F6; }
  .lrow { border-bottom: 1px solid #F2F4F8; }
  .lrow:last-child { border-bottom: none; }
  .subj { text-align: center; font-size: 13px; font-weight: 700; padding: 7px 0; border-radius: 10px; }
  .file { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .ftype { width: 36px; height: 40px; border-radius: 8px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#fff; flex-shrink:0; background:#EF4444; }
  .fname { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fdesc { font-size: 12px; color: #9AA3B2; margin-top: 3px; }
  .date { color: #9AA3B2; font-size: 14px; }
  .acts { display: flex; gap: 8px; }
  .act { border: 1px solid #C9D6F5; background: #fff; color: #2563EB; border-radius: 10px; padding: 9px 0; font-size: 13px; font-weight: 700; cursor: pointer; flex: 1; text-align: center; text-decoration: none; }
  .act:hover { background: #F0F4FF; }
  .act.dl { background: #2563EB; color: #fff; border-color: #2563EB; }
  .act.dl:hover { background: #1d4fd7; }
  .empty { padding: 40px; text-align: center; color: #aaa; }

  .recent { background: #fff; border: 1px solid #EEF1F6; border-radius: 16px; padding: 18px 22px; margin-top: 18px; }
  .recent-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .recent-head b { font-size: 15px; }
  .recent-head span { font-size: 13px; color: #9AA3B2; }
  .recent-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .rcard { display: flex; align-items: center; gap: 10px; }
  .rname { font-size: 14px; font-weight: 700; }
  .rmeta { font-size: 12px; color: #9AA3B2; }
</style>
</head>
<body>
<div class="s-wrap">
  <div th:replace="~{fragments/student-sidebar :: studentSidebar('materials')}"></div>
  <main class="s-main">
    <div th:replace="~{fragments/student-topbar :: studentTopbar}"></div>
    <h1 class="page-title">강의자료</h1>
    <p class="page-sub">선생님이 올린 학습 자료를 확인하고 다운로드해보세요.</p>

    <div class="toolbar">
      <button class="tab on" data-f="all" onclick="setFilter(this)">전체</button>
      <button class="tab" data-f="LESSON" onclick="setFilter(this)">수업 자료</button>
      <button class="tab" data-f="REFERENCE" onclick="setFilter(this)">참고 자료</button>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA3B2" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchBox" placeholder="자료 제목 검색" oninput="render()">
      </div>
    </div>

    <div class="list">
      <div class="lhead"><span>분류</span><span>자료 정보</span><span>업로드일 ↓</span><span></span></div>
      <div id="rows"><div class="empty">자료를 불러오는 중...</div></div>
    </div>

    <div class="recent">
      <div class="recent-head"><b>최근 올라온 자료</b></div>
      <div class="recent-row" id="recent"></div>
    </div>
  </main>
</div>

<script>
  var CAT = { LESSON: { t:'수업 자료', bg:'#E8F0FE', c:'#2563EB' }, REFERENCE: { t:'참고 자료', bg:'#FFF1DD', c:'#D98A20' } };
  var MATERIALS = [];
  var filter = 'all';

  function catOf(m) { return (m.category === 'REFERENCE') ? 'REFERENCE' : 'LESSON'; }
  function fmtDate(s) {
    if (!s) return '-';
    var d = new Date(s);
    if (isNaN(d)) return s;
    return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }

  function setFilter(btn) {
    filter = btn.dataset.f;
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('on', t === btn); });
    render();
  }

  async function load() {
    var teacherId = localStorage.getItem('studentTeacherId');
    var url = '/api/materials/public' + (teacherId ? ('?teacherId=' + encodeURIComponent(teacherId)) : '');
    try {
      var res = await fetch(url);
      if (!res.ok) throw new Error('status ' + res.status);
      MATERIALS = await res.json();
    } catch (e) {
      console.error('자료 로드 실패', e);
      document.getElementById('rows').innerHTML = '<div class="empty">자료를 불러오지 못했어요.</div>';
      return;
    }
    render();
    renderRecent();
  }

  function render() {
    var kw = document.getElementById('searchBox').value.trim();
    var rows = MATERIALS.filter(function (m) {
      return (filter === 'all' || catOf(m) === filter) && (!kw || (m.fileName || '').indexOf(kw) > -1);
    });
    var box = document.getElementById('rows');
    if (!rows.length) { box.innerHTML = '<div class="empty">해당하는 자료가 없어요.</div>'; return; }
    box.innerHTML = rows.map(function (m) {
      var cat = CAT[catOf(m)];
      var subj = m.subject ? esc(m.subject) : '자료';
      var desc = 'PDF · ' + (m.totalPages || 0) + '페이지';
      return '<div class="lrow">' +
        '<span class="subj" style="background:' + cat.bg + ';color:' + cat.c + '">' + cat.t + '</span>' +
        '<div class="file"><span class="ftype">PDF</span>' +
        '<div style="min-width:0"><div class="fname" title="' + esc(m.fileName) + '">' + esc(m.fileName) + '</div>' +
        '<div class="fdesc">' + subj + ' · ' + desc + '</div></div></div>' +
        '<span class="date">' + fmtDate(m.uploadedAt) + '</span>' +
        '<div class="acts">' +
          '<a class="act" href="/api/materials/' + m.materialId + '/view" target="_blank" rel="noopener">보기</a>' +
          '<a class="act dl" href="/api/materials/' + m.materialId + '/download">다운로드</a>' +
        '</div></div>';
    }).join('');
  }

  function renderRecent() {
    var r = MATERIALS.slice(0, 3);
    var box = document.getElementById('recent');
    if (!r.length) { box.innerHTML = '<div class="rmeta">아직 올라온 자료가 없어요.</div>'; return; }
    box.innerHTML = r.map(function (m) {
      return '<div class="rcard"><span class="ftype">PDF</span>' +
        '<div><div class="rname">' + esc(m.fileName) + '</div>' +
        '<div class="rmeta">' + (m.subject ? esc(m.subject) + ' · ' : '') + fmtDate(m.uploadedAt) + '</div></div></div>';
    }).join('');
  }

  load();
</script>
</body>
</html>
