<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClassMate – 일정 관리</title>
  <link rel="stylesheet" th:href="@{/css/layout.css}">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/fonts.css}">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; background: #f4f5f7; color: #1a1a1a; font-size: 14px; }
     
    /* ─── WRAP ─────────────────────────────────────────────── */
    .page-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    main {
      flex: 1; overflow-y: auto;
      padding: 28px 28px 36px;
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: flex-start;
    }
    .col-left {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-width: 0;
    }
    .col-right {
      flex: 0 0 340px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 화면이 좁아지면 우측 패널을 캘린더 아래 전체폭으로 (찌그러짐 방지) */
    @media (max-width: 1200px) {
      main { flex-direction: column; }
      .col-left, .col-right { flex: 1 1 auto; width: 100%; min-width: 0; }
    }

    /* ─── CARD BASE ─────────────────────────────────────────── */
    .card {
      background: #fff;
      border-radius: 14px;
      border: 1px solid #eaeaf0;
      box-shadow: 0 1px 4px rgba(0,0,0,.04);
    }

    /* ─── CALENDAR CARD ─────────────────────────────────────── */
    .calendar-card {
      padding: 22px;
    }
    .cal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px;
    }
    .cal-header-left { display: flex; align-items: center; gap: 12px; }
    .cal-year-month { font-size: 17px; font-weight: 700; }
    .cal-nav {
      display: flex; align-items: center; gap: 2px;
    }
    .cal-nav button {
      width: 28px; height: 28px; border: 1px solid #e2e8f0;
      background: #fff; border-radius: 7px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #64748b; transition: background .15s;
    }
    .cal-nav button:hover { background: #f1f5f9; }
    .cal-header-right { display: flex; align-items: center; gap: 8px; }
    .view-select {
      padding: 6px 10px; border: 1px solid #e2e8f0;
      border-radius: 7px; font-size: 13px; cursor: pointer;
      color: #374151; background: #fff;
    }
    .btn-add {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      background: #2563eb; color: #fff;
      border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background .15s;
    }
    .btn-add:hover { background: #1d4ed8; }

    /* Calendar grid */
    .cal-grid { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .cal-grid th, .cal-grid td { width: 14.2857%; }
    .cal-grid th {
      text-align: center; font-size: 12px; font-weight: 600;
      color: #94a3b8; padding: 6px 0 10px; letter-spacing: .03em;
    }
    .cal-grid th:first-child { color: #f87171; }
    .cal-grid th:last-child  { color: #60a5fa; }
    .cal-grid td {
      vertical-align: top; padding: 4px; height: 80px;
      border-top: 1px solid #f1f5f9; cursor: pointer;
      position: relative; transition: background .12s;
    }
    .cal-grid td:hover { background: #f8faff; border-radius: 8px; }
    .cal-grid td.other-month .day-num { color: #cbd5e1; }
    .cal-grid td.today .day-num {
      background: #2563eb; color: #fff;
      border-radius: 50%; width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
    }
    .cal-grid td.selected { background: #eff4ff !important; border-radius: 8px; }
    .day-num {
      font-size: 13px; font-weight: 500; color: #374151;
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px;
    }
    .cal-grid td:nth-child(1) .day-num { color: #f87171; }
    .cal-grid td:nth-child(7) .day-num { color: #60a5fa; }
    .cal-grid td.today .day-num { color: #fff !important; }
    .cal-grid td.other-month .day-num { color: #cbd5e1 !important; }

    .event-dot {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 500;
      padding: 2px 5px; border-radius: 4px;
      margin-top: 2px; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 100%;
    }
    .event-dot::before {
      content: '●'; font-size: 7px; flex-shrink: 0;
    }
    .type-수업   { color: #2563eb; background: #eff6ff; }
    .type-상담   { color: #e11d48; background: #fff1f2; }
    .type-회의   { color: #16a34a; background: #f0fdf4; }
    .type-수행평가 { color: #d97706; background: #fffbeb; }
    .type-개인   { color: #7c3aed; background: #f5f3ff; }

    /* Legend */
    .cal-legend {
      display: flex; align-items: center; gap: 16px;
      margin-top: 14px; flex-wrap: wrap;
    }
    .legend-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; color: #64748b;
    }
    .legend-dot {
      width: 10px; height: 10px; border-radius: 50%;
    }

    /* Upcoming */
    .upcoming-card {
      grid-column: 1;
      grid-row: 3;
      padding: 20px 22px;
    }
    .upcoming-card .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-title { font-size: 15px; font-weight: 700; }
    .link-more { font-size: 12px; color: #2563eb; cursor: pointer; text-decoration: none;
      display: flex; align-items: center; gap: 3px; }

    table.upcoming-table { width: 100%; border-collapse: collapse; }
    table.upcoming-table th {
      font-size: 12px; font-weight: 600; color: #94a3b8;
      text-align: left; padding: 0 8px 8px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    table.upcoming-table td {
      font-size: 13px; color: #374151;
      padding: 9px 8px 9px 0;
      border-bottom: 1px solid #f8fafc;
      vertical-align: middle;
    }
    .badge {
      display: inline-block; padding: 3px 8px;
      border-radius: 5px; font-size: 11px; font-weight: 600;
    }
    .badge-예정 { background: #eff6ff; color: #2563eb; }
    .badge-완료 { background: #f0fdf4; color: #16a34a; }
    .badge-취소 { background: #fef2f2; color: #ef4444; }

    .upcoming-footer {
      margin-top: 12px; font-size: 12px; color: #94a3b8;
      display: flex; align-items: center; gap: 6px;
    }

    /* ─── RIGHT COLUMN ──────────────────────────────────────── */
    /* Today's schedule */
    .today-card {
      grid-column: 2;
      grid-row: 1;
      padding: 20px;
    }
    .today-card .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 4px;
    }
    .today-date-sub { font-size: 12px; color: #94a3b8; margin-bottom: 14px; }

    .schedule-item {
      display: flex; gap: 10px; padding: 10px 0;
      border-bottom: 1px solid #f8fafc; cursor: pointer;
      transition: background .12s; border-radius: 8px;
      padding-left: 6px; padding-right: 6px;
    }
    .schedule-item:hover { background: #f8faff; }
    .schedule-item:last-child { border-bottom: none; }
    .sched-time {
      font-size: 11px; color: #94a3b8; min-width: 68px; padding-top: 2px;
      line-height: 1.5;
    }
    .sched-icon {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .sched-icon.수업   { background: #eff6ff; color: #2563eb; }
    .sched-icon.상담   { background: #fff1f2; color: #e11d48; }
    .sched-icon.회의   { background: #f0fdf4; color: #16a34a; }
    .sched-icon.수행평가 { background: #fffbeb; color: #d97706; }
    .sched-icon.개인   { background: #f5f3ff; color: #7c3aed; }
    .sched-body { flex: 1; min-width: 0; }
    .sched-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; word-break: keep-all; overflow-wrap: anywhere; }
    .sched-desc  { font-size: 11px; color: #94a3b8; line-height: 1.4; word-break: keep-all; overflow-wrap: anywhere; }
    .sched-badge {
      align-self: flex-start; padding: 3px 8px;
      border-radius: 5px; font-size: 11px; font-weight: 600;
      flex-shrink: 0;
    }

    /* Form card */
    .form-card {
      grid-column: 2;
      grid-row: 2;
      padding: 20px;
    }
    .form-card .section-header { margin-bottom: 16px; }
    .form-row { margin-bottom: 14px; }
    .form-label { font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 6px; display: block; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 9px 12px;
      border: 1px solid #e2e8f0; border-radius: 8px;
      font-size: 13px; color: #374151;
      background: #fff; outline: none;
      transition: border .15s;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }
    input[type="date"],
	input[type="time"] {
	  font-family: inherit;
	}
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.08);
    }
    .form-textarea { resize: vertical; min-height: 72px; font-family: inherit; }

    .time-row { display: flex; gap: 8px; align-items: center; }
    .time-row .form-input { flex: 1; }
    .time-sep { color: #94a3b8; font-size: 13px; }

    .form-btns { display: flex; gap: 10px; margin-top: 18px; }
    .btn-reset {
      flex: 1; padding: 10px; border: 1px solid #e2e8f0;
      background: #fff; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer; color: #64748b;
      transition: background .15s;
    }
    .btn-reset:hover { background: #f8fafc; }
    .btn-save {
      flex: 1; padding: 10px; border: none;
      background: #2563eb; color: #fff;
      border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    .btn-save:hover { background: #1d4ed8; }
    .btn-delete {
      flex: 1; padding: 10px; border: 1px solid #fecaca;
      background: #fff; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer; color: #ef4444;
      transition: background .15s;
    }
    .btn-delete:hover { background: #fff1f2; }
    .btn-modify {
      flex: 1; padding: 10px; border: none;
      background: #2563eb; color: #fff;
      border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    .btn-modify:hover { background: #1d4ed8; }

    /* empty state */
    .empty-sched {
      text-align: center; padding: 24px 0;
      color: #94a3b8; font-size: 13px;
    }
  </style>
</head>
<body>
<div class="layout-wrapper">

  <div th:replace="~{fragments/sidebar :: sidebar('schedule')}"></div>

  <div class="layout-main">

    <div th:replace="~{fragments/header :: header(${userName}, ${profileImgUrl})}"></div>

    <!-- ── MAIN ── -->
    <main id="page-body">
    <div class="col-left">

      <!-- ① Calendar Card -->
      <div class="card calendar-card">
        <div class="cal-header">
          <div class="cal-header-left">
            <span class="cal-year-month" id="cal-title"></span>
            <div class="cal-nav">
              <button id="btn-prev" aria-label="이전 달">&#8249;</button>
              <button id="btn-next" aria-label="다음 달">&#8250;</button>
            </div>
          </div>
          <div class="cal-header-right">
            <select class="view-select"><option>월</option><option>주</option><option>일</option></select>
            <button class="btn-add" id="btn-add-schedule">＋ 일정 등록</button>
          </div>
        </div>
        <table class="cal-grid" id="cal-grid">
          <thead>
            <tr>
              <th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th>
            </tr>
          </thead>
          <tbody id="cal-body"></tbody>
        </table>
        <div class="cal-legend">
          <div class="legend-item"><div class="legend-dot" style="background:#2563eb"></div>수업</div>
          <div class="legend-item"><div class="legend-dot" style="background:#e11d48"></div>상담</div>
          <div class="legend-item"><div class="legend-dot" style="background:#16a34a"></div>회의</div>
          <div class="legend-item"><div class="legend-dot" style="background:#d97706"></div>수행평가</div>
          <div class="legend-item"><div class="legend-dot" style="background:#7c3aed"></div>개인 일정</div>
        </div>
      </div>

      <!-- ④ Upcoming -->
      <div class="card upcoming-card">
        <div class="section-header">
          <span class="section-title">다가오는 일정</span>
          <a class="link-more" href="#">전체 보기 ›</a>
        </div>
        <table class="upcoming-table">
          <thead>
            <tr>
              <th>날짜</th><th>시간</th><th>일정명</th><th>유형</th><th>상태</th>
            </tr>
          </thead>
          <tbody id="upcoming-body"></tbody>
        </table>
        <div class="upcoming-footer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          일정 클릭 시 상세 내용을 확인할 수 있습니다.
        </div>
      </div>

    </div><!-- /col-left -->
    <div class="col-right">

      <!-- ② Today's Schedule -->
      <div class="card today-card">
        <div class="section-header">
          <span class="section-title">오늘의 일정</span>
          <a class="link-more" href="#">전체 일정 보기 ›</a>
        </div>
        <div class="today-date-sub" id="today-date-sub"></div>
        <div id="today-schedule-list"></div>
      </div>

      <!-- ③ Form Card -->
      <div class="card form-card">
        <div class="section-header">
          <span class="section-title">일정 등록 / 수정</span>
        </div>

        <div class="form-row">
          <label class="form-label" for="f-type">일정 유형</label>
          <select id="f-type" class="form-select">
            <option value="수업">수업</option>
            <option value="상담">상담</option>
            <option value="회의">회의</option>
            <option value="수행평가">수행평가</option>
            <option value="개인">개인</option>
          </select>
        </div>

        <div class="form-row">
          <label class="form-label">제목</label>
          <input type="text" id="f-title" class="form-input" placeholder="일정 제목을 입력하세요" />
        </div>

        <div class="form-row">
          <label class="form-label">날짜</label>
          <input type="date" id="f-date" class="form-input" />
        </div>

        <div class="form-row">
          <label class="form-label">시간</label>
          <div class="time-row">
            <input type="time" id="f-start" class="form-input" />
            <span class="time-sep">~</span>
            <input type="time" id="f-end" class="form-input" />
          </div>
        </div>

        <div class="form-row">
          <label class="form-label">장소</label>
          <input type="text" id="f-place" class="form-input" placeholder="장소를 입력하세요" />
        </div>

        <div class="form-row">
          <label class="form-label">메모</label>
          <textarea id="f-memo" class="form-textarea" placeholder="메모를 입력하세요"></textarea>
        </div>

        <div class="form-btns" id="form-btns">
          <button class="btn-reset" id="btn-reset">초기화</button>
          <button class="btn-save"  id="btn-save">저장</button>
        </div>
      </div>

    </div><!-- /col-right -->

    </main>
  </div>
</div>

<script>
// ──────────────────────────────────────────────
//  DATA STORE
// ──────────────────────────────────────────────
const TYPES = {
  '수업':   { color:'#2563eb', bg:'#eff6ff' },
  '상담':   { color:'#e11d48', bg:'#fff1f2' },
  '회의':   { color:'#16a34a', bg:'#f0fdf4' },
  '수행평가':{ color:'#d97706', bg:'#fffbeb' },
  '개인':   { color:'#7c3aed', bg:'#f5f3ff' },
};

const WEEK_DAYS = ['일','월','화','수','목','금','토'];
const today = new Date();

let curYear  = today.getFullYear();
let curMonth = today.getMonth();  // 0-based

// Generate some default events
let events = [];
let nextId = 1;

function addEvent(obj) {
  events.push({ id: nextId++, ...obj });
}

// Sample events based on the screenshot (May 2024 → but use current year/month so it's live)
const SAMPLE_MONTH = today.getMonth();
const SAMPLE_YEAR  = today.getFullYear();
function d(day) {
  const dt = new Date(SAMPLE_YEAR, SAMPLE_MONTH, day);
  return dt.toISOString().split('T')[0];
}

addEvent({ date: d(1), title:'교과 회의', type:'회의', start:'14:00', end:'15:00', place:'교무실', memo:'다음 학기 교과 과정 논의' });
addEvent({ date: d(2), title:'수행평가 준비', type:'수행평가', start:'09:00', end:'10:00', place:'3학년 교실', memo:'주제 선정 및 문항 구성' });
addEvent({ date: d(3), title:'학부모 상담', type:'상담', start:'10:30', end:'11:00', place:'상담실', memo:'박서준 학생 보호자 학습 태도 및 진도 점검' });
addEvent({ date: d(6), title:'영어 수업', type:'수업', start:'11:20', end:'12:10', place:'1학년 3반 교실', memo:'교과서 Unit 5 본문 학습' });
addEvent({ date: d(8), title:'학부모 상담', type:'상담', start:'10:30', end:'11:00', place:'상담실', memo:'2학년 학부모 면담' });
addEvent({ date: d(8), title:'개인 일정', type:'개인', start:'19:00', end:'20:00', place:'', memo:'연구 수업 준비' });
addEvent({ date: d(10), title:'영어 수업', type:'수업', start:'11:20', end:'12:10', place:'1학년 3반 교실', memo:'Unit 6 듣기 활동' });
addEvent({ date: d(13), title:'교과 회의', type:'회의', start:'13:30', end:'14:10', place:'교무실', memo:'교과 협의회 (영어과) 다음 달 평가 계획 논의' });
addEvent({ date: d(14), title:'영어 수업', type:'수업', start:'11:20', end:'12:10', place:'1학년 3반 교실', memo:'Unit 6 읽기 활동' });
addEvent({ date: d(15), title:'수행평가 준비', type:'수행평가', start:'15:30', end:'16:20', place:'3학년 교실', memo:'2학년 영어 수행평가 주제 선정 및 문항 구성' });
addEvent({ date: today.toISOString().split('T')[0], title:'학부모 상담', type:'상담', start:'10:30', end:'11:00', place:'상담실', memo:'박서준 학생 보호자 학습 태도 및 진도 점검' });
addEvent({ date: today.toISOString().split('T')[0], title:'영어 수업 (1학년 3반)', type:'수업', start:'11:20', end:'12:10', place:'1학년 3반 교실', memo:'교과서 Unit 5 본문 학습 및 활동지 풀이' });
addEvent({ date: today.toISOString().split('T')[0], title:'교과 회의', type:'회의', start:'13:30', end:'14:10', place:'교무실', memo:'교과 협의회 (영어과) 다음 달 평가 계획 논의' });

addEvent({ date: today.toISOString().split('T')[0], title:'개인 일정', type:'개인', start:'19:00', end:'20:00', place:'', memo:'연구 수업 준비' });

addEvent({ date: d(29), title:'영어 수업', type:'수업', start:'11:20', end:'12:10', place:'1학년 3반 교실', memo:'Unit 8' });

// ──────────────────────────────────────────────
//  STATE
// ──────────────────────────────────────────────
let selectedDate = today.toISOString().split('T')[0];
let selectedEventId = null;   // null = 등록 모드, number = 수정 모드

// ──────────────────────────────────────────────
//  HELPERS
// ──────────────────────────────────────────────
function getEventsForDate(dateStr) {
  return events.filter(e => e.date === dateStr).sort((a,b) => a.start.localeCompare(b.start));
}

function fmtDate(dateStr) {
  const dt = new Date(dateStr + 'T00:00:00');
  const days = ['일','월','화','수','목','금','토'];
  return `${dt.getFullYear()}년 ${dt.getMonth()+1}월 ${dt.getDate()}일 (${days[dt.getDay()]})`;
}

function typeIcon(type) {
  const icons = {
    '수업': `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>`,
    '상담': `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>`,
    '회의': `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>`,
    '수행평가': `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>`,
    '개인': `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>`,
  };
  return icons[type] || '';
}

// ──────────────────────────────────────────────
//  RENDER CALENDAR
// ──────────────────────────────────────────────
function renderCalendar() {
  const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('cal-title').textContent = `${curYear}년 ${MONTHS[curMonth]}`;

  const body = document.getElementById('cal-body');
  body.innerHTML = '';

  const first = new Date(curYear, curMonth, 1);
  const last  = new Date(curYear, curMonth+1, 0);
  const startDay = first.getDay();
  const todayStr = today.toISOString().split('T')[0];

  let cells = [];
  // prev month filler
  for (let i = 0; i < startDay; i++) {
    const dt = new Date(curYear, curMonth, -startDay+1+i);
    cells.push({ date: dt, other: true });
  }
  // current month
  for (let d = 1; d <= last.getDate(); d++) {
    cells.push({ date: new Date(curYear, curMonth, d), other: false });
  }
  // next month filler
  while (cells.length % 7 !== 0) {
    const dt = new Date(curYear, curMonth+1, cells.length - startDay - last.getDate() + 1);
    cells.push({ date: dt, other: true });
  }

  for (let r = 0; r < cells.length / 7; r++) {
    const tr = document.createElement('tr');
    for (let c = 0; c < 7; c++) {
      const { date, other } = cells[r*7+c];
      const dateStr = date.toISOString().split('T')[0];
      const td = document.createElement('td');
      if (other)              td.classList.add('other-month');
      if (dateStr === todayStr) td.classList.add('today');
      if (dateStr === selectedDate) td.classList.add('selected');

      const evs = getEventsForDate(dateStr);
      let html = `<div class="day-num">${date.getDate()}</div>`;
      evs.slice(0,3).forEach(ev => {
        html += `<div class="event-dot type-${ev.type}" data-id="${ev.id}" data-date="${dateStr}">${ev.title}</div>`;
      });
      if (evs.length > 3) html += `<div style="font-size:10px;color:#94a3b8;padding-left:4px;">+${evs.length-3}개</div>`;
      td.innerHTML = html;

      // click on cell → select date
      td.addEventListener('click', (e) => {
        if (e.target.classList.contains('event-dot')) return;
        selectDate(dateStr);
      });
      // click on event dot → load event into form
      td.querySelectorAll && setTimeout(() => {
        td.querySelectorAll('.event-dot').forEach(dot => {
          dot.addEventListener('click', (e) => {
            e.stopPropagation();
            selectDate(dateStr);
            loadEventToForm(parseInt(dot.dataset.id));
          });
        });
      }, 0);

      tr.appendChild(td);
    }
    body.appendChild(tr);
  }

  renderTodaySchedule();
  renderUpcoming();
}

function selectDate(dateStr) {
  selectedDate = dateStr;
  selectedEventId = null;
  resetForm();
  renderCalendar();
  renderTodaySchedule();
}

// ──────────────────────────────────────────────
//  RENDER TODAY'S SCHEDULE
// ──────────────────────────────────────────────
function renderTodaySchedule() {
  document.getElementById('today-date-sub').textContent = fmtDate(selectedDate);
  const list = document.getElementById('today-schedule-list');
  const evs  = getEventsForDate(selectedDate);
  if (!evs.length) {
    list.innerHTML = '<div class="empty-sched">이 날의 일정이 없습니다.</div>';
    return;
  }
  list.innerHTML = evs.map(ev => `
    <div class="schedule-item" data-id="${ev.id}" onclick="loadEventToForm(${ev.id})">
      <div class="sched-time">${ev.start}<br>~ ${ev.end}</div>
      <div class="sched-icon ${ev.type}">${typeIcon(ev.type)}</div>
      <div class="sched-body">
        <div class="sched-title">${ev.title}</div>
        <div class="sched-desc">${ev.place ? ev.place + '<br>' : ''}${ev.memo||''}</div>
      </div>
      <div class="sched-badge" style="background:${TYPES[ev.type].bg};color:${TYPES[ev.type].color};">${ev.type}</div>
    </div>
  `).join('');
}

// ──────────────────────────────────────────────
//  RENDER UPCOMING
// ──────────────────────────────────────────────
function renderUpcoming() {
  const todayStr = today.toISOString().split('T')[0];
  const upcoming = events
    .filter(e => e.date >= todayStr)
    .sort((a,b) => a.date.localeCompare(b.date) || a.start.localeCompare(b.start))
    .slice(0,6);

  const body = document.getElementById('upcoming-body');
  if (!upcoming.length) {
    body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:16px;">다가오는 일정이 없습니다.</td></tr>';
    return;
  }
  body.innerHTML = upcoming.map(ev => {
    const dt = new Date(ev.date + 'T00:00:00');
    const days = ['일','월','화','수','목','금','토'];
    const df = `${(dt.getMonth()+1).toString().padStart(2,'0')}.${dt.getDate().toString().padStart(2,'0')} (${days[dt.getDay()]})`;
    return `
      <tr style="cursor:pointer" onclick="selectDate('${ev.date}'); loadEventToForm(${ev.id})">
        <td>${df}</td>
        <td>${ev.start} ~ ${ev.end}</td>
        <td>${ev.title}</td>
        <td><span class="event-dot type-${ev.type}" style="display:inline-flex;">${ev.type}</span></td>
        <td><span class="badge badge-예정">예정</span></td>
      </tr>`;
  }).join('');
}

// ──────────────────────────────────────────────
//  FORM: load / reset / save / delete
// ──────────────────────────────────────────────
function loadEventToForm(id) {
  const ev = events.find(e => e.id === id);
  if (!ev) return;
  selectedEventId = id;
  document.getElementById('f-type').value = ev.type;
  document.getElementById('f-title').value = ev.title;
  document.getElementById('f-date').value  = ev.date;
  document.getElementById('f-start').value = ev.start;
  document.getElementById('f-end').value   = ev.end;
  document.getElementById('f-place').value = ev.place;
  document.getElementById('f-memo').value  = ev.memo;
  setFormMode('edit');
}

function resetForm() {
  selectedEventId = null;
  document.getElementById('f-type').value = '수업';
  document.getElementById('f-title').value = '';
  document.getElementById('f-date').value  = selectedDate;
  document.getElementById('f-start').value = '';
  document.getElementById('f-end').value   = '';
  document.getElementById('f-place').value = '';
  document.getElementById('f-memo').value  = '';
  setFormMode('create');
}

function setFormMode(mode) {
  const btns = document.getElementById('form-btns');
  if (mode === 'edit') {
    btns.innerHTML = `
      <button class="btn-delete" id="btn-delete">삭제</button>
      <button class="btn-modify" id="btn-modify">수정</button>`;
    document.getElementById('btn-delete').onclick = deleteEvent;
    document.getElementById('btn-modify').onclick = modifyEvent;
  } else {
    btns.innerHTML = `
      <button class="btn-reset" id="btn-reset">초기화</button>
      <button class="btn-save"  id="btn-save">저장</button>`;
    document.getElementById('btn-reset').onclick = () => resetForm();
    document.getElementById('btn-save').onclick  = saveEvent;
  }
}

function getFormData() {
  return {
    type:  document.getElementById('f-type').value,
    title: document.getElementById('f-title').value.trim(),
    date:  document.getElementById('f-date').value,
    start: document.getElementById('f-start').value,
    end:   document.getElementById('f-end').value,
    place: document.getElementById('f-place').value.trim(),
    memo:  document.getElementById('f-memo').value.trim(),
  };
}

function saveEvent() {
  const data = getFormData();
  if (!data.title) { alert('제목을 입력해 주세요.'); return; }
  if (!data.date)  { alert('날짜를 선택해 주세요.'); return; }
  addEvent(data);
  selectedDate = data.date;
  resetForm();
  renderCalendar();
}

function modifyEvent() {
  if (!selectedEventId) return;
  const data = getFormData();
  if (!data.title) { alert('제목을 입력해 주세요.'); return; }
  const idx = events.findIndex(e => e.id === selectedEventId);
  if (idx !== -1) events[idx] = { id: selectedEventId, ...data };
  selectedDate = data.date;
  selectedEventId = null;
  resetForm();
  renderCalendar();
}

function deleteEvent() {
  if (!selectedEventId) return;
  if (!confirm('이 일정을 삭제하시겠습니까?')) return;
  events = events.filter(e => e.id !== selectedEventId);
  selectedEventId = null;
  resetForm();
  renderCalendar();
}

// ──────────────────────────────────────────────
//  CALENDAR NAV
// ──────────────────────────────────────────────
document.getElementById('btn-prev').onclick = () => {
  curMonth--;
  if (curMonth < 0) { curMonth = 11; curYear--; }
  selectedEventId = null;
  setFormMode('create');
  renderCalendar();
};
document.getElementById('btn-next').onclick = () => {
  curMonth++;
  if (curMonth > 11) { curMonth = 0; curYear++; }
  selectedEventId = null;
  setFormMode('create');
  renderCalendar();
};

document.getElementById('btn-add-schedule').onclick = () => {
  resetForm();
  document.getElementById('f-date').value = selectedDate;
  document.getElementById('f-title').focus();
};

// ──────────────────────────────────────────────
//  INIT
// ──────────────────────────────────────────────
resetForm();
renderCalendar();
document.getElementById('f-date').value = selectedDate;

// Wire up initial buttons
document.getElementById('btn-reset').onclick = () => resetForm();
document.getElementById('btn-save').onclick  = saveEvent;
</script>
