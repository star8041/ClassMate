<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 학생 페이지 공통 상단바. <main class="s-main"> 의 첫 자식으로 넣어 사용 -->
<th:block th:fragment="studentTopbar">
  <style>
    /* s-main 패딩(36 44)을 상쇄해 상단바를 전체폭으로 */
    .s-topbar {
      display: flex; align-items: center; justify-content: flex-end; gap: 16px;
      height: 72px; background: #fff; border-bottom: 1px solid #EEF1F6;
      margin: -36px -44px 28px; padding: 0 28px;
    }
    .s-topbar .stb-me { display: flex; align-items: center; gap: 10px; }
    .s-topbar .stb-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, #a5c8ff, #dbe8ff);
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .s-topbar .stb-name { font-weight: 700; font-size: 14px; }
    .s-topbar .stb-grade {
      background: #EAF1FE; color: #2563EB; font-size: 12px; font-weight: 700;
      padding: 4px 10px; border-radius: 20px;
    }
    .s-topbar .stb-logout {
      display: flex; align-items: center; gap: 6px;
      color: #6B7280; font-size: 14px; font-weight: 600; text-decoration: none;
    }
    .s-topbar .stb-logout:hover { color: #2563EB; }
  </style>
  <!-- class="topbar" 도 같이 부여 → 학생 사이드바의 전환버튼 재배치 로직이 이 곳으로 이동 -->
  <div class="s-topbar topbar">
    <div class="stb-me">
      <div class="stb-avatar" id="stbAvatar">🧒</div>
      <span class="stb-name" id="studentName">학생</span>
      <span class="stb-grade" id="studentGrade">3학년 2반</span>
    </div>
    <a href="/members/logout" class="stb-logout">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      로그아웃
    </a>
  </div>
  <script>
    (function () {
      var token = localStorage.getItem('accessToken');
      var payload = null;
      if (token) {
        try {
          var b64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
          payload = JSON.parse(decodeURIComponent(escape(atob(b64))));
        } catch (e) { payload = null; }
      }
      var nm = document.getElementById('studentName');
      var gr = document.getElementById('studentGrade');
      var av = document.getElementById('stbAvatar');
      if (payload && payload.role === 'ADMIN') {
        // 관리자가 학생 화면을 둘러보는 경우 → '관리자'로 표기
        if (nm) nm.textContent = payload.name || '관리자';
        if (gr) gr.textContent = '관리자 모드';
        if (av) av.textContent = '🛡️';
      } else {
        var sn = localStorage.getItem('studentName');
        if (sn && nm) nm.textContent = sn;
      }
    })();
  </script>
</th:block>
</body>
</html>
