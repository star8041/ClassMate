<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상담 관리 - 미리보기</title>
<link rel="stylesheet" th:href="@{/css/layout.css}">
<link rel="stylesheet" th:href="@{/css/sidebar.css}">
<link rel="stylesheet" th:href="@{/css/fonts.css}">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; background: #f4f5f7; color: #1a1a1a; font-size: 14px; }

  .page-body { padding: 28px 36px; min-width: 860px; }

  .page-title { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; }
  .page-subtitle { font-size: 13px; color: #999; margin-bottom: 28px; }

  /* ── 섹션 공통 ── */
  .section { background: #fff; border-radius: 12px; border: 0.5px solid #e0e0e0; padding: 22px 24px; margin-bottom: 20px; }
  .section-heading { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; color: #1a1a1a; margin-bottom: 16px; }
  .section-heading svg { color: #666; flex-shrink: 0; }

  /* ══ 일정 테이블 ══ */
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 12px; color: #aaa; font-weight: 500;
    padding: 8px 10px; border-bottom: 0.5px solid #e8e8e8;
  }
  tbody td { padding: 11px 10px; font-size: 13px; color: #333; border-bottom: 0.5px solid #f2f2f2; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #fafafa; }

  .badge {
    display: inline-block; font-size: 11px; font-weight: 600;
    border-radius: 6px; padding: 3px 9px;
  }
  .badge-scheduled { background: #eef2ff; color: #4f80f7; }
  .badge-done      { background: #e8f5e9; color: #388e3c; }

  .btn-menu { background: none; border: none; cursor: pointer; color: #bbb; padding: 2px 4px; border-radius: 4px; }
  .btn-menu:hover { background: #f0f0f0; color: #555; }

  /* 페이지네이션 */
  .pagination-wrap { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .pagination { display: flex; align-items: center; gap: 4px; }
  .page-btn {
    width: 28px; height: 28px; border-radius: 6px; border: none; background: none;
    font-size: 12px; color: #555; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .page-btn:hover { background: #f0f0f0; }
  .page-btn.active { background: #4f80f7; color: #fff; font-weight: 600; }
  .page-btn.nav { color: #aaa; }
  .total-count { font-size: 12px; color: #aaa; }

  /* ══ 녹음 업로드 섹션 ══ */
  .upload-grid {
    display: grid;
    grid-template-columns: 1fr 28px 1fr 28px 1fr;
    gap: 0;
    align-items: start;
    margin-top: 4px;
  }

  .step-header { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .step-num {
    width: 20px; height: 20px; border-radius: 50%; background: #4f80f7;
    color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .step-title { font-size: 13px; font-weight: 600; color: #333; }

  .arrow-col { display: flex; align-items: flex-start; justify-content: center; padding-top: 44px; color: #ccc; }

  /* 업로드 드롭존 */
  .dropzone {
    border: 1.5px dashed #d0d0d0; border-radius: 10px; padding: 24px 16px;
    text-align: center; background: #fafafa; cursor: pointer; margin-bottom: 10px;
    transition: border-color 0.15s;
  }
  .dropzone:hover { border-color: #4f80f7; background: #f0f4ff; }
  .dropzone svg { color: #bbb; margin-bottom: 8px; }
  .dropzone-main { font-size: 12px; color: #555; line-height: 1.5; margin-bottom: 4px; }
  .dropzone-sub { font-size: 11px; color: #bbb; }

  .file-item {
    border: 1px solid #e0e0e0; border-radius: 8px; padding: 8px 12px;
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px; background: #fff;
  }
  .file-item svg { color: #888; flex-shrink: 0; }
  .file-name { font-size: 12px; color: #333; font-weight: 500; flex: 1; }
  .file-size { font-size: 11px; color: #aaa; }
  .file-del { background: none; border: none; cursor: pointer; color: #ccc; padding: 0; }
  .file-del:hover { color: #e55; }

  .player-row {
    border: 1px solid #e0e0e0; border-radius: 8px; padding: 8px 12px;
    display: flex; align-items: center; gap: 8px; background: #fff; margin-bottom: 10px;
  }
  .play-btn { background: none; border: none; cursor: pointer; color: #555; padding: 0; }
  .time-text { font-size: 11px; color: #888; white-space: nowrap; }
  .progress { flex: 1; height: 3px; background: #e0e0e0; border-radius: 3px; position: relative; }
  .progress-fill { width: 0%; height: 100%; background: #4f80f7; border-radius: 3px; }
  .volume-btn { background: none; border: none; cursor: pointer; color: #aaa; padding: 0; }
  .more-btn { background: none; border: none; cursor: pointer; color: #bbb; padding: 0; }

  .btn-upload-new {
    width: 100%; border: 1px solid #d0d0d0; border-radius: 8px; padding: 8px;
    background: #fff; font-size: 12px; color: #555; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .btn-upload-new:hover { background: #f5f5f5; }

  /* 텍스트 변환 결과 */
  .lang-tag { font-size: 11px; color: #aaa; text-align: right; margin-bottom: 6px; }
  .transcript-box {
    background: #fafafa; border: 1px solid #e8e8e8; border-radius: 8px;
    padding: 12px 14px; font-size: 12px; color: #444; line-height: 1.7;
    margin-bottom: 8px; min-height: 110px;
  }
  .transcript-meta { font-size: 11px; color: #aaa; margin-bottom: 10px; }
  .transcript-meta span { margin-right: 12px; }
  .btn-retranscribe {
    width: 100%; border: 1px solid #d0d0d0; border-radius: 8px; padding: 8px;
    background: #fff; font-size: 12px; color: #555; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .btn-retranscribe:hover { background: #f5f5f5; }

  /* 자동 요약 */
  .summary-badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: #e8f5e9; color: #388e3c; font-size: 11px; font-weight: 600;
    border-radius: 6px; padding: 3px 8px; margin-bottom: 8px;
  }
  .summary-box {
    background: #fafafa; border: 1px solid #e8e8e8; border-radius: 8px;
    padding: 12px 14px; margin-bottom: 10px; min-height: 140px;
  }
  .summary-list { list-style: none; padding: 0; }
  .summary-list li {
    font-size: 12px; color: #444; line-height: 1.7; padding-left: 14px;
    position: relative; margin-bottom: 2px;
  }
  .summary-list li::before { content: '•'; position: absolute; left: 0; color: #4f80f7; font-weight: 700; }
  .summary-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-save-summary {
    background: #4f80f7; border: none; border-radius: 8px; padding: 9px;
    font-size: 12px; font-weight: 600; color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .btn-save-summary:hover { background: #3a6ae0; }
  .btn-copy {
    background: #fff; border: 1px solid #d0d0d0; border-radius: 8px; padding: 9px;
    font-size: 12px; color: #555; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .btn-copy:hover { background: #f5f5f5; }
</style>
</head>
<body>
<div class="layout-wrapper">

  <div th:replace="~{fragments/sidebar :: sidebar('counseling')}"></div>
  <div class="layout-main">
    <div th:replace="~{fragments/header :: header(${userName}, ${profileImgUrl})}"></div>
    <main class="page-body">
	  <h1 class="page-title">상담 관리</h1>
	  <p class="page-subtitle">상담 일정 등록부터 상담 녹음 관리, 텍스트 변환, 요약까지 한번에 관리하세요.</p>
	
	  <!-- ══ 등록된 상담 일정 조회 ══ -->
	  <div class="section">
	    <div class="section-heading">
	      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
	      등록된 상담 일정 조회
	    </div>
	
	    <table>
	      <thead>
	        <tr>
	          <th>학생명</th>
	          <th>학부모명</th>
	          <th>날짜</th>
	          <th>시간</th>
	          <th>상담 주제</th>
	          <th>상태</th>
	        </tr>
	      </thead>
	            <tbody id="counsel-body">
        <tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:20px;">상담 일정을 불러오는 중...</td></tr>
      </tbody>
	    </table>
	
	    <div class="pagination-wrap" id="paginationWrap" style="display:none">
      <div class="pagination" id="pagination"></div>
      <span class="total-count" id="totalCount">전체 0건</span>
    </div>
  </div>
	
	  <!-- ══ 녹음 업로드 & 텍스트 변환 & 자동 요약 ══ -->
	  <div class="section">
	    <div class="section-heading">
	      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
	      상담 녹음 업로드 및 텍스트 변환 · 자동 요약
	    </div>
	
	    <div class="upload-grid">

      <!-- ① 녹음 업로드 -->
      <div>
        <div class="step-header">
          <div class="step-num">1</div>
          <div class="step-title">녹음 업로드</div>
        </div>

        <input type="file" id="audioInput" accept=".mp3,.m4a,.wav,.webm,.ogg,.flac,.mp4,.mpeg" style="display:none" />
        <div class="dropzone" id="dropzone">
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
          <div class="dropzone-main">녹음 파일을 드래그하거나<br>클릭하여 업로드하세요</div>
          <div class="dropzone-sub">지원 형식: MP3, M4A, WAV (최대 25MB)</div>
        </div>

        <div class="file-item" id="fileInfo" style="display:none">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
          <div style="flex:1">
            <div class="file-name" id="fileName">-</div>
            <div class="file-size" id="fileSize"></div>
          </div>
          <button class="file-del" id="fileDel" title="제거">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div style="margin-top:10px">
          <label style="font-size:11px;color:#999;display:block;margin-bottom:4px">연결할 상담 일정 (저장용)</label>
          <select id="noteSchedule" style="width:100%;padding:7px 10px;border:1px solid #e0e0e0;border-radius:8px;font-size:12px;color:#444;background:#fff">
            <option value="">상담 일정을 선택하세요</option>
          </select>
        </div>
      </div>

      <!-- 화살표 -->
      <div class="arrow-col">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </div>

      <!-- ② 텍스트 변환 결과 -->
      <div>
        <div class="step-header">
          <div class="step-num">2</div>
          <div class="step-title">텍스트 변환 결과</div>
        </div>

        <div class="transcript-box" id="transcriptBox" style="white-space:pre-wrap">녹음 파일을 업로드하면 자동으로 텍스트로 변환됩니다.</div>
        <div class="transcript-meta" id="transcriptMeta"></div>

        <button class="btn-retranscribe" id="btnRetranscribe" disabled style="opacity:.5;cursor:default">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.52"/></svg>
          다시 변환하기
        </button>
      </div>

      <!-- 화살표 -->
      <div class="arrow-col">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </div>

      <!-- ③ 자동 요약 -->
      <div>
        <div class="step-header">
          <div class="step-num">3</div>
          <div class="step-title">자동 요약</div>
        </div>

        <div id="summaryBadgeWrap"></div>
        <div class="summary-box" id="summaryBox"><span style="font-size:12px;color:#aaa">변환이 끝나면 AI가 핵심 내용을 요약합니다.</span></div>

        <div class="summary-actions">
          <button class="btn-save-summary" id="btnSaveSummary">요약 저장</button>
          <button class="btn-copy" id="btnCopySummary">요약 복사</button>
        </div>
      </div>

    </div><!-- /upload-grid -->
	  </div>
    </main>
  </div>
</div>
<script th:src="@{/js/layout.js}"></script>
<script>
  (function () {
    function authHeaders() {
      var t = localStorage.getItem('accessToken');
      return t ? { 'Authorization': 'Bearer ' + t } : {};
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; });
    }
    function fmtDate(iso) {
      if (!iso) return '-';
      var d = new Date(iso); if (isNaN(d)) return iso;
      var days = ['일','월','화','수','목','금','토'];
      return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' +
             String(d.getDate()).padStart(2,'0') + ' (' + days[d.getDay()] + ')';
    }
    function fmtTime(iso) {
      if (!iso) return '';
      var d = new Date(iso); if (isNaN(d)) return '';
      return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }

    var allRows = [];        // 전체 상담 일정
    var curPage = 1;
    var PAGE_SIZE = 8;

    async function load() {
      var body = document.getElementById('counsel-body');
      try {
        var res = await fetch('/api/schedules?type=' + encodeURIComponent('상담'), { headers: authHeaders() });
        if (!res.ok) throw new Error('status ' + res.status);
        allRows = await res.json();
        curPage = 1;
        renderPage();
        fillScheduleDropdown();
      } catch (e) {
        console.error('상담 일정 로드 실패', e);
        body.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#c0392b;padding:20px;">상담 일정을 불러오지 못했어요. (교사 로그인 상태를 확인해 주세요)</td></tr>';
        document.getElementById('paginationWrap').style.display = 'none';
      }
    }

    function renderPage() {
      var body = document.getElementById('counsel-body');
      var wrap = document.getElementById('paginationWrap');
      var total = allRows.length;

      if (!total) {
        body.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:20px;">등록된 상담 일정이 없습니다. 일정 관리에서 ‘상담’ 유형으로 등록해 보세요.</td></tr>';
        wrap.style.display = 'none';
        return;
      }

      var totalPages = Math.ceil(total / PAGE_SIZE);
      if (curPage > totalPages) curPage = totalPages;
      var startIdx = (curPage - 1) * PAGE_SIZE;
      var pageRows = allRows.slice(startIdx, startIdx + PAGE_SIZE);
      var now = Date.now();

      body.innerHTML = pageRows.map(function (s) {
        var done = s.scheduledAt && new Date(s.scheduledAt).getTime() < now;
        var badge = done
          ? '<span class="badge badge-done">완료</span>'
          : '<span class="badge badge-scheduled">예정</span>';
        var student = s.studentName ? esc(s.studentName) : esc(s.title || '-');
        var topic = s.topic ? esc(s.topic) : esc(s.title || '-');
        return '<tr>' +
          '<td>' + student + '</td>' +
          '<td>' + (s.parentName ? esc(s.parentName) : '-') + '</td>' +
          '<td>' + fmtDate(s.scheduledAt) + '</td>' +
          '<td>' + fmtTime(s.scheduledAt) + '</td>' +
          '<td>' + topic + '</td>' +
          '<td>' + badge + '</td>' +
        '</tr>';
      }).join('');

      // 페이지네이션: 페이지가 1개뿐이면 버튼 숨기고 건수만 표시
      wrap.style.display = 'flex';
      var pag = document.getElementById('pagination');
      document.getElementById('totalCount').textContent = '전체 ' + total + '건';
      if (totalPages <= 1) {
        pag.innerHTML = '';
        return;
      }
      var html = '<button class="page-btn nav" data-go="prev"' + (curPage === 1 ? ' disabled style="opacity:.4;cursor:default"' : '') + '>&#8249;</button>';
      for (var i = 1; i <= totalPages; i++) {
        html += '<button class="page-btn' + (i === curPage ? ' active' : '') + '" data-go="' + i + '">' + i + '</button>';
      }
      html += '<button class="page-btn nav" data-go="next"' + (curPage === totalPages ? ' disabled style="opacity:.4;cursor:default"' : '') + '>&#8250;</button>';
      pag.innerHTML = html;
      pag.querySelectorAll('.page-btn').forEach(function (b) {
        b.addEventListener('click', function () {
          var g = b.dataset.go;
          if (g === 'prev') { if (curPage > 1) curPage--; }
          else if (g === 'next') { if (curPage < totalPages) curPage++; }
          else { curPage = Number(g); }
          renderPage();
        });
      });
    }

    function fillScheduleDropdown() {
      var sel = document.getElementById('noteSchedule');
      if (!sel) return;
      sel.innerHTML = '<option value="">상담 일정을 선택하세요</option>' + allRows.map(function (s) {
        var label = (s.studentName || s.title || '상담') + ' · ' + fmtDate(s.scheduledAt);
        return '<option value="' + s.scheduleId + '">' + esc(label) + '</option>';
      }).join('');
    }

    // ── 녹음 업로드 → 변환 → 요약 ───────────────────────────
    var lastResult = null;  // { transcript, summary, followUp }

    function humanSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    async function uploadAndTranscribe(file) {
      document.getElementById('fileInfo').style.display = 'flex';
      document.getElementById('fileName').textContent = file.name;
      document.getElementById('fileSize').textContent = humanSize(file.size);
      var tBox = document.getElementById('transcriptBox');
      var sBox = document.getElementById('summaryBox');
      var badge = document.getElementById('summaryBadgeWrap');
      tBox.textContent = '🎧 음성을 텍스트로 변환하는 중... (잠시만 기다려 주세요)';
      document.getElementById('transcriptMeta').textContent = '';
      badge.innerHTML = '';
      sBox.innerHTML = '<span style="font-size:12px;color:#aaa">변환 후 요약됩니다.</span>';

      var fd = new FormData();
      fd.append('file', file);
      try {
        var res = await fetch('/api/v1/counseling/transcribe', {
          method: 'POST', headers: authHeaders(), body: fd
        });
        if (!res.ok) {
          var msg = res.status === 502
            ? '음성 변환에 실패했어요. (OpenAI 음성 인식 호출 오류 — 서버 API 키 확인)'
            : '변환에 실패했어요. (상태 ' + res.status + ')';
          tBox.textContent = '⚠️ ' + msg;
          return;
        }
        var data = await res.json();
        lastResult = data;
        tBox.textContent = data.transcript || '(추출된 텍스트가 없습니다)';
        document.getElementById('transcriptMeta').innerHTML =
          '<span>변환 일시: ' + fmtDate(new Date().toISOString()) + ' ' + fmtTime(new Date().toISOString()) + '</span>' +
          '<span>글자 수: ' + (data.charCount || 0) + '</span>';
        renderSummary(data.summary);
      } catch (e) {
        console.error(e);
        tBox.textContent = '⚠️ 변환 중 오류가 발생했어요.';
      }
    }

    function renderSummary(summary) {
      var sBox = document.getElementById('summaryBox');
      var badge = document.getElementById('summaryBadgeWrap');
      if (!summary) {
        sBox.innerHTML = '<span style="font-size:12px;color:#aaa">요약을 생성하지 못했어요.</span>';
        return;
      }
      badge.innerHTML = '<span class="summary-badge"><svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>요약 완료</span>';
      var lines = summary.split('\n').map(function (l) { return l.replace(/^[-•*]\s*/, '').trim(); }).filter(Boolean);
      sBox.innerHTML = '<ul class="summary-list">' + lines.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>';
    }

    function wireRecording() {
      var input = document.getElementById('audioInput');
      var zone = document.getElementById('dropzone');
      zone.addEventListener('click', function () { input.click(); });
      input.addEventListener('change', function (e) {
        if (e.target.files && e.target.files[0]) uploadAndTranscribe(e.target.files[0]);
      });
      zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.style.borderColor = '#4f80f7'; });
      zone.addEventListener('dragleave', function () { zone.style.borderColor = ''; });
      zone.addEventListener('drop', function (e) {
        e.preventDefault(); zone.style.borderColor = '';
        if (e.dataTransfer.files && e.dataTransfer.files[0]) uploadAndTranscribe(e.dataTransfer.files[0]);
      });
      document.getElementById('fileDel').addEventListener('click', function () {
        input.value = ''; lastResult = null;
        document.getElementById('fileInfo').style.display = 'none';
        document.getElementById('transcriptBox').textContent = '녹음 파일을 업로드하면 자동으로 텍스트로 변환됩니다.';
        document.getElementById('transcriptMeta').textContent = '';
        document.getElementById('summaryBadgeWrap').innerHTML = '';
        document.getElementById('summaryBox').innerHTML = '<span style="font-size:12px;color:#aaa">변환이 끝나면 AI가 핵심 내용을 요약합니다.</span>';
      });

      document.getElementById('btnSaveSummary').addEventListener('click', async function () {
        if (!lastResult) { alert('먼저 녹음을 변환해 주세요.'); return; }
        var scheduleId = document.getElementById('noteSchedule').value;
        if (!scheduleId) { alert('저장할 상담 일정을 선택해 주세요.'); return; }
        try {
          var res = await fetch('/api/v1/counseling-notes', {
            method: 'POST',
            headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
            body: JSON.stringify({ scheduleId: Number(scheduleId), rawText: lastResult.transcript, summaryText: lastResult.summary, followUpText: lastResult.followUp || '' })
          });
          alert(res.ok ? '상담 기록이 저장되었어요.' : '저장에 실패했어요. (상태 ' + res.status + ')');
        } catch (e) { alert('저장 중 오류가 발생했어요.'); }
      });

      document.getElementById('btnCopySummary').addEventListener('click', function () {
        if (!lastResult || !lastResult.summary) { alert('복사할 요약이 없어요.'); return; }
        navigator.clipboard && navigator.clipboard.writeText(lastResult.summary).then(function () {
          var b = document.getElementById('btnCopySummary'); var t = b.textContent;
          b.textContent = '복사됨!'; setTimeout(function () { b.textContent = t; }, 1200);
        });
      });
    }

    wireRecording();
    load();
  })();
</script>
</body>
</html>
