<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 학생용 공통 셸(사이드바). 페이지는 .s-wrap > [이 프래그먼트] + main.s-main 구조로 사용 -->
<th:block th:fragment="studentSidebar(active)">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; background: #F7F9FC; color: #2B2F38; font-size: 14px; }
    a { text-decoration: none; color: inherit; }
    .s-wrap { display: flex; min-height: 100vh; }
    .s-main { flex: 1; min-width: 0; padding: 36px 44px; }

    .s-side { width: 248px; flex-shrink: 0; background: #fff; border-right: 1px solid #EEF1F6; padding: 24px 16px; display: flex; flex-direction: column; }
    .s-logo { display: flex; align-items: center; gap: 9px; font-size: 21px; font-weight: 800; color: #2563EB; padding: 4px 10px 26px; }
    .s-nav { display: flex; flex-direction: column; gap: 4px; }
    .s-nav a { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 12px; font-size: 15px; font-weight: 600; color: #6B7280; }
    .s-nav a:hover { background: #F4F7FB; }
    .s-nav a.on { background: #EAF1FE; color: #2563EB; }
    .s-nav a svg { flex-shrink: 0; }
    .s-nav a .dot { width: 7px; height: 7px; border-radius: 50%; background: #EF4444; margin-left: auto; }
    .s-user { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px; border-top: 1px solid #F0F2F6; }
    .s-ava { width: 38px; height: 38px; border-radius: 50%; background: #EEF2F8; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .s-name { font-weight: 700; font-size: 14px; }
    .s-grade { font-size: 12px; color: #9AA3B2; }
  </style>
  <aside class="s-side">
    <div class="s-logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#2563EB"><path d="M3 5a2 2 0 0 1 2-2h6v16H5a2 2 0 0 0-2 2zM13 3h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2h-6z"/></svg>
      ClassMate
    </div>
    <nav class="s-nav">
      <a th:href="@{/student/home}" th:classappend="${active == 'home'} ? ' on'">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        홈
      </a>
      <a th:href="@{/student/quiz}" th:classappend="${active == 'quiz'} ? ' on'">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
        퀴즈
      </a>
      <a th:href="@{/student/materials}" th:classappend="${active == 'materials'} ? ' on'">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        강의자료
      </a>
      <a href="#" onclick="comingSoon('시간표'); return false;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        시간표
      </a>
      <a href="#" onclick="comingSoon('공지사항'); return false;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        공지사항
        <span class="dot"></span>
      </a>
      <a href="#" onclick="comingSoon('설정'); return false;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        설정
      </a>
    </nav>
    <div class="s-user">
      <div class="s-ava">🧑‍🎓</div>
      <div><div class="s-name">김학생</div><div class="s-grade">3학년 2반</div></div>
    </div>
  </aside>
  <script>
    // 학생 사이드바 공통: 미구현 탭 안내 토스트
    function comingSoon(name) {
      var t = document.createElement('div');
      t.textContent = '🚧 ' + name + ' 기능은 준비 중이에요!';
      t.style.cssText = 'position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:#2B2F38;color:#fff;padding:13px 22px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:9999;opacity:0;transition:opacity .2s;';
      document.body.appendChild(t);
      requestAnimationFrame(function () { t.style.opacity = '1'; });
      setTimeout(function () { t.style.opacity = '0'; setTimeout(function () { t.remove(); }, 250); }, 1800);
    }
  </script>
</th:block>
</body>
</html>
